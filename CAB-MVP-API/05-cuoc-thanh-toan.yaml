openapi: 3.0.3
info:
  title: MVP-05 — Cước và thanh toán
  version: 0.2.0
  description: Đặc tả API đề xuất cho CAB theo module MVP của SRS. File độc lập để nhập Swagger Editor. Các chính
    sách TBD chưa phải yêu cầu đã phê duyệt; URL chỉ minh họa, chưa có backend.
servers:
- url: https://api.cab.example.com/api/v1
  description: Máy chủ minh họa
security:
- BearerAuth: []
paths:
  /trips/{tripId}/fare:
    get:
      tags:
      - MVP-05
      summary: Lấy cước của chuyến đi
      operationId: getTripFare
      description: 'Cước do xử lý nội bộ tính khi completed, không cho khách truyền số tiền. Chưa tính xong trả
        409 FARE_NOT_READY; thiếu chính sách trả 409 POLICY_NOT_CONFIGURED; không tự gán 0 khi lỗi.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có fares:read. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-01.'
      x-function: getTripFare
      x-functional-requirements:
      - FR-11
      - FR-13
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có fares:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy cước của chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
              example:
                tripId: 11111111-1111-4111-8111-111111111111
                amount: 125000
                currency: VND
                calculationReference: fare-policy-example-v1
                calculatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-01
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy cước của chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/fare'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /trips/{tripId}/payments:
    post:
      tags:
      - MVP-05
      summary: Tạo thanh toán hoặc thử lại sau thất bại
      operationId: createTripPayment
      description: 'Chỉ tạo khi chuyến completed và có cước. Tiền mặt tạo pending, chưa coi là đã thu; điện tử tạo
        processing và checkoutUrl nếu có. Khóa theo chuyến: đã succeeded trả 409 TRIP_ALREADY_PAID; còn pending/processing
        trả 409 PAYMENT_IN_PROGRESS. Chỉ thử lần mới sau thất bại chắc chắn và khi chính sách cho phép, với key
        mới. Timeout đối tác giữ processing để đối soát nội bộ.


        Quyền: Khách của chuyến. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-05.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: createTripPayment
      x-functional-requirements:
      - FR-14
      - FR-15
      - FR-17
      x-authorization: Khách của chuyến
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo thanh toán hoặc thử lại sau thất bại thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                method: cash
                amount: 125000
                currency: VND
                status: pending
                providerReference: null
                checkoutUrl: null
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-05
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              method: cash
      x-codeSamples:
      - lang: cURL
        label: Tạo thanh toán hoặc thử lại sau thất bại
        source: "curl -X POST 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/payments'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001' \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"method\": \"cash\"}'"
      security:
      - BearerAuth: []
    get:
      tags:
      - MVP-05
      summary: Lấy các lần thanh toán của chuyến
      operationId: listTripPayments
      description: 'Trả trạng thái từng lần; không bao gồm dữ liệu thanh toán nhạy cảm.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có payments:read. Kiểm tra quyền và phạm vi
        tài nguyên tại máy chủ.


        checkoutUrl chỉ trả cho khách sở hữu giao dịch; trả null cho tài xế/vận hành. Không ghi URL chứa token vào
        log.'
      x-function: listTripPayments
      x-functional-requirements:
      - FR-11
      - FR-17
      - FR-23
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có payments:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy các lần thanh toán của chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  method: electronic
                  amount: 125000
                  currency: VND
                  status: processing
                  providerReference: provider_tx_example
                  checkoutUrl: https://payments.example.com/checkout/example
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy các lần thanh toán của chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/payments'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /payments/{paymentId}:
    get:
      tags:
      - MVP-05
      summary: Lấy kết quả một giao dịch
      operationId: getPaymentById
      description: 'Tra cứu kết quả hiện biết. pending/processing không phải thất bại; hệ thống tiếp tục kiểm tra
        kết quả đối tác.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có payments:read. Kiểm tra quyền và phạm vi
        tài nguyên tại máy chủ.


        checkoutUrl chỉ trả cho khách sở hữu giao dịch; trả null cho tài xế/vận hành. Không ghi URL chứa token vào
        log.'
      x-function: getPaymentById
      x-functional-requirements:
      - FR-16
      - FR-17
      - FR-23
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có payments:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy kết quả một giao dịch thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                method: electronic
                amount: 125000
                currency: VND
                status: processing
                providerReference: provider_tx_example
                checkoutUrl: https://payments.example.com/checkout/example
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: paymentId
        in: path
        required: true
        description: Mã paymentId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy kết quả một giao dịch
        source: "curl -X GET 'https://api.cab.example.com/api/v1/payments/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /payments/{paymentId}/cash-confirmation:
    post:
      tags:
      - MVP-05
      summary: Xác nhận đã thu tiền mặt
      operationId: confirmCashPayment
      description: 'Chỉ giao dịch cash pending của chuyến liên quan. Xác nhận thực thu một lần, ghi audit và sự
        kiện payment_succeeded. Chưa chốt quyền xác nhận trả 409 POLICY_NOT_CONFIGURED.


        Quyền: Người được quyền payments:confirm-cash theo TBD-05; nếu là tài xế phải được phân công chuyến. Đề
        xuất thiết kế API; cần xác nhận chính sách tại TBD-05, TBD-11.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: confirmCashPayment
      x-functional-requirements:
      - FR-14
      x-authorization: Người được quyền payments:confirm-cash theo TBD-05; nếu là tài xế phải được phân công chuyến
      x-status: proposed-contract
      responses:
        '200':
          description: Xác nhận đã thu tiền mặt thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                method: cash
                amount: 125000
                currency: VND
                status: succeeded
                providerReference: null
                checkoutUrl: null
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-05
      - TBD-11
      parameters:
      - name: paymentId
        in: path
        required: true
        description: Mã paymentId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashConfirmation'
            example:
              collected: true
      x-codeSamples:
      - lang: cURL
        label: Xác nhận đã thu tiền mặt
        source: "curl -X POST 'https://api.cab.example.com/api/v1/payments/11111111-1111-4111-8111-111111111111/cash-confirmation'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001' \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"collected\": true}'"
      security:
      - BearerAuth: []
  /payments/provider-webhook:
    post:
      tags:
      - MVP-05
      summary: Nhận kết quả thanh toán từ đối tác
      operationId: handlePaymentWebhook
      description: 'Hợp đồng adapter đề xuất: X-CAB-Signature là hex HMAC-SHA256 của timestamp + dấu chấm + raw
        request body bằng secret riêng của đối tác; X-CAB-Timestamp là Unix seconds. Kiểm tra cửa sổ chống phát
        lại đã cấu hình, eventId, paymentId, providerReference, amount/currency. Sai chữ ký trả 401; lệch số tiền/tham
        chiếu trả 422 PAYMENT_MISMATCH. Chỉ giao dịch electronic; không hạ succeeded về failed. Sự kiện hợp lệ lặp
        trả 200 và không thu/ghi doanh thu/thông báo trùng. Chỉ ack sau ghi bền vững; chưa lưu được trả 503 để đối
        tác gửi lại.


        Quyền: Nhà cung cấp có chữ ký HMAC hợp lệ. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-05.'
      x-function: handlePaymentWebhook
      x-functional-requirements:
      - FR-16
      - FR-18
      x-authorization: Nhà cung cấp có chữ ký HMAC hợp lệ
      x-status: proposed-contract
      responses:
        '200':
          description: Nhận kết quả thanh toán từ đối tác thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
              example:
                received: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-05
      security:
      - WebhookSignature: []
      parameters:
      - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhook'
            example:
              eventId: evt_example_001
              paymentId: 11111111-1111-4111-8111-111111111111
              providerReference: provider_tx_example
              status: succeeded
              amount: 125000
              currency: VND
              occurredAt: '2026-09-13T08:00:00Z'
      x-codeSamples:
      - lang: cURL
        label: Nhận kết quả thanh toán từ đối tác
        source: "curl -X POST 'https://api.cab.example.com/api/v1/payments/provider-webhook' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'X-CAB-Signature: REPLACE_WITH_VALID_HMAC_HEX' \\\n  -H 'X-CAB-Timestamp: REPLACE_WITH_UNIX_SECONDS'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"eventId\": \"evt_example_001\", \"paymentId\"\
          : \"11111111-1111-4111-8111-111111111111\", \"providerReference\": \"provider_tx_example\", \"status\"\
          : \"succeeded\", \"amount\": 125000, \"currency\": \"VND\", \"occurredAt\": \"2026-09-13T08:00:00Z\"}'"
components:
  schemas:
    Fare:
      type: object
      additionalProperties: false
      properties:
        tripId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        amount:
          type: integer
          description: Số tiền theo đơn vị nhỏ nhất của currency; VND là đồng. Không nhận số tiền client để tính
            cước.
          example: 125000
          minimum: 0
          format: int64
        currency:
          type: string
          description: Mã tiền tệ; VND là ví dụ đề xuất
          example: VND
          pattern: ^[A-Z]{3}$
        calculationReference:
          type: string
          description: Phiên bản/quy tắc tính cước đã dùng
          example: fare-policy-example-v1
        calculatedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - tripId
      - amount
      - currency
      - calculationReference
      - calculatedAt
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    Payment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tripId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        method:
          type: string
          description: Phương thức
          example: electronic
          enum:
          - cash
          - electronic
        amount:
          type: integer
          description: Số tiền theo đơn vị nhỏ nhất của currency; VND là đồng. Không nhận số tiền client để tính
            cước.
          example: 125000
          minimum: 0
          format: int64
        currency:
          type: string
          description: Mã tiền tệ
          example: VND
          pattern: ^[A-Z]{3}$
        status:
          type: string
          description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
          example: processing
          enum:
          - pending
          - processing
          - succeeded
          - failed
        providerReference:
          type: string
          description: Tham chiếu nhà cung cấp; null với tiền mặt
          example: provider_tx_example
          nullable: true
        checkoutUrl:
          type: string
          description: Trang thanh toán do đối tác cung cấp; null khi không cần chuyển hướng Chỉ chủ thanh toán
            được nhận URL; trả null cho tài xế và vận hành vì URL có thể mang quyền thanh toán.
          example: https://payments.example.com/checkout/example
          format: uri
          nullable: true
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - tripId
      - method
      - amount
      - currency
      - status
      - providerReference
      - checkoutUrl
      - createdAt
    PaymentRequest:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          description: Phương thức thanh toán
          example: cash
          enum:
          - cash
          - electronic
      required:
      - method
      description: Số tiền lấy từ cước trên máy chủ; không nhận dữ liệu thẻ hoặc tài khoản thanh toán.
    PaymentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    CashConfirmation:
      type: object
      additionalProperties: false
      properties:
        collected:
          type: boolean
          enum:
          - true
          description: Xác nhận đã thực sự thu tiền
          example: true
      required:
      - collected
    WebhookAck:
      type: object
      additionalProperties: false
      properties:
        received:
          type: boolean
          example: true
          description: Sự kiện hợp lệ đã được ghi nhận bền vững hoặc đã xử lý trước đó
      required:
      - received
    PaymentWebhook:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          description: Mã sự kiện dùng chống xử lý trùng
          example: evt_example_001
          minLength: 1
        paymentId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        providerReference:
          type: string
          description: Tham chiếu nhà cung cấp
          example: provider_tx_example
          minLength: 1
        status:
          type: string
          description: Kết quả chắc chắn từ đối tác
          example: succeeded
          enum:
          - succeeded
          - failed
        amount:
          type: integer
          description: Số tiền theo đơn vị nhỏ nhất của currency; VND là đồng. Không nhận số tiền client để tính
            cước.
          example: 125000
          minimum: 0
          format: int64
        currency:
          type: string
          description: Đối chiếu với giao dịch gốc
          example: VND
          pattern: ^[A-Z]{3}$
        occurredAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - eventId
      - paymentId
      - providerReference
      - status
      - amount
      - currency
      - occurredAt
      description: Hợp đồng webhook chuẩn hóa đề xuất; cần adapter theo nhà cung cấp thật tại TBD-05.
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-CAB-Signature
      description: Chữ ký hex HMAC-SHA256 của timestamp.rawBody; đây là chữ ký động, không phải khóa API tĩnh. Secret
        không truyền trong request. Hợp đồng đề xuất TBD-05.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống xử lý lặp do client tạo. Phạm vi chủ thể + operationId; payload khác cùng key trả
        409. Thời hạn lưu theo cấu hình đã duyệt.
      schema:
        type: string
        description: Khóa yêu cầu
        example: example-request-001
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: Trang bắt đầu từ 1; mặc định đề xuất 1.
      schema:
        type: integer
        description: Trang
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
      schema:
        type: integer
        description: Kích thước trang
        example: 20
        minimum: 1
        maximum: 100
        default: 20
    WebhookTimestamp:
      name: X-CAB-Timestamp
      in: header
      required: true
      description: Unix seconds dùng trong chữ ký; kiểm tra cửa sổ chống phát lại cấu hình theo TBD-05.
      schema:
        type: string
        description: Thời điểm ký
        example: '1789286400'
        pattern: ^[0-9]+$
tags:
- name: MVP-05
  description: Cước và thanh toán
