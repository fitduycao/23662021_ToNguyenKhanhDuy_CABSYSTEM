components:
  schemas:
    Driver:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã tài xế
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        accountId:
          type: string
          description: Mã tài khoản
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
        availability:
          type: string
          description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
          example: available
          enum:
          - offline
          - available
          - busy
      required:
      - id
      - accountId
      - fullName
      - phone
      - status
      - availability
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    Registration:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        password:
          type: string
          description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
          example: ExampleOnly_ChangeMe_123!
          minLength: 1
          writeOnly: true
      required:
      - fullName
      - phone
      - password
      description: Đề xuất dùng điện thoại/mật khẩu; không cho client truyền role hoặc trạng thái đặc quyền.
    DriverPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
      minProperties: 1
    AvailabilityRequest:
      type: object
      additionalProperties: false
      properties:
        availability:
          type: string
          description: Chỉ thay đổi trạng thái chủ động; không được bật available nếu có chuyến đang phục vụ
          example: offline
          enum:
          - offline
          - available
      required:
      - availability
    DriverLocation:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        recordedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
        receivedAt:
          type: string
          description: Thời điểm máy chủ nhận vị trí
          example: '2026-09-13T08:00:00Z'
          format: date-time
        freshness:
          type: string
          description: Độ mới theo chính sách TBD-06
          example: fresh
          enum:
          - fresh
          - stale
          - unknown
      required:
      - driverId
      - coordinates
      - recordedAt
      - receivedAt
      - freshness
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ
          example: 106.7009
      required:
      - latitude
      - longitude
    LocationUpdate:
      type: object
      additionalProperties: false
      properties:
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        recordedAt:
          type: string
          description: Thời điểm thiết bị ghi vị trí; kiểm tra độ mới theo TBD-06
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - coordinates
      - recordedAt
    ServiceTypePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    ServiceType:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        name:
          type: string
          description: Tên loại xe/dịch vụ minh họa, danh mục TBD-14
          example: Xe 4 chỗ
        active:
          type: boolean
          description: Có đang nhận đặt xe không
          example: true
      required:
      - id
      - name
      - active
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        plateNumber:
          type: string
          description: Biển số; quy tắc kiểm tra TBD-08
          example: 51A-123.45
        model:
          type: string
          description: Mẫu xe
          example: Toyota Vios
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      required:
      - id
      - driverId
      - serviceTypeId
      - plateNumber
      - model
      - status
    CreateVehicleRequest:
