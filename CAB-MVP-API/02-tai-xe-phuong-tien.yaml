openapi: 3.0.3
info:
  title: MVP-02 — Tài xế và phương tiện
  version: 0.2.0
  description: Đặc tả API đề xuất cho CAB theo module MVP của SRS. File độc lập để nhập Swagger Editor. Các chính
    sách TBD chưa phải yêu cầu đã phê duyệt; URL chỉ minh họa, chưa có backend.
servers:
- url: https://api.cab.example.com/api/v1
  description: Máy chủ minh họa
security:
- BearerAuth: []
paths:
  /drivers:
    post:
      tags:
      - MVP-02
      summary: Vận hành tạo tài khoản tài xế
      operationId: createDriver
      description: 'Tạo tài khoản và hồ sơ tài xế; vai trò driver do máy chủ đặt. Tài xế mới chưa tự động sẵn sàng
        nhận chuyến.


        Quyền: operator/admin có drivers:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: createDriver
      x-functional-requirements:
      - FR-02
      - FR-20
      x-authorization: operator/admin có drivers:create
      x-status: proposed-contract
      responses:
        '201':
          description: Vận hành tạo tài khoản tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: offline
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Vận hành tạo tài khoản tài xế
        source: "curl -X POST 'https://api.cab.example.com/api/v1/drivers' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  --data\
          \ '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"\
          }'"
      security:
      - BearerAuth: []
    get:
      tags:
      - MVP-02
      summary: Lấy danh sách tài xế
      operationId: listDrivers
      description: 'Tra cứu tài xế và tình trạng phục vụ, có phân trang.


        Quyền: operator/admin có drivers:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listDrivers
      x-functional-requirements:
      - FR-20
      - FR-21
      x-authorization: operator/admin có drivers:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  accountId: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  status: active
                  availability: available
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: availability
        in: query
        required: false
        description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
        schema:
          type: string
          description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
          example: available
          enum:
          - offline
          - available
          - busy
      - name: status
        in: query
        required: false
        description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
        schema:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /drivers/{driverId}:
    get:
      tags:
      - MVP-02
      summary: Lấy chi tiết tài xế
      operationId: getDriverById
      description: 'Hồ sơ đầy đủ chỉ cho tài xế đó và vận hành; khách xem thông tin phục vụ qua tracking.


        Quyền: Chính tài xế hoặc operator/admin có drivers:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getDriverById
      x-functional-requirements:
      - FR-02
      - FR-21
      x-authorization: Chính tài xế hoặc operator/admin có drivers:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111' \\\
          \n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
    patch:
      tags:
      - MVP-02
      summary: Cập nhật hồ sơ tài xế
      operationId: updateDriver
      description: 'Cập nhật hồ sơ và đồng bộ trường tài khoản tương ứng; không thay đổi phân công hoặc trạng thái
        busy.


        Quyền: Chính tài xế hoặc operator/admin có drivers:update. Đề xuất thiết kế API; cần xác nhận chính sách
        tại TBD-08.'
      x-function: updateDriver
      x-functional-requirements:
      - FR-02
      - FR-20
      x-authorization: Chính tài xế hoặc operator/admin có drivers:update
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật hồ sơ tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
      x-codeSamples:
      - lang: cURL
        label: Cập nhật hồ sơ tài xế
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\"}'"
      security:
      - BearerAuth: []
    delete:
      tags:
      - MVP-02
      summary: Xóa mềm tài xế
      operationId: deactivateDriver
      description: 'Đề xuất CRUD: vô hiệu hóa tài khoản tài xế, đưa offline, thu hồi phiên; giữ lịch sử. Tài xế
        đang phục vụ hoặc còn xử lý thanh toán trả 409 DRIVER_IN_USE. Gọi lặp trả 204.


        Quyền: admin có drivers:deactivate. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: deactivateDriver
      x-functional-requirements:
      - FR-20
      x-authorization: admin có drivers:deactivate
      x-status: proposed-extension
      responses:
        '204':
          description: Thực hiện thành công, không có response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Xóa mềm tài xế
        source: "curl -X DELETE 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /drivers/{driverId}/availability:
    patch:
      tags:
      - MVP-02
      summary: Đổi trạng thái sẵn sàng của tài xế
      operationId: updateDriverAvailability
      description: 'Chỉ cho chọn available/offline. busy do hệ thống quản lý; không cho available khi có phân công
        đang hiệu lực. Kiểm tra tài khoản và phương tiện đủ điều kiện.


        Quyền: Chính tài xế. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-02, TBD-06, TBD-08.'
      x-function: updateDriverAvailability
      x-functional-requirements:
      - FR-04
      x-authorization: Chính tài xế
      x-status: proposed-contract
      responses:
        '200':
          description: Đổi trạng thái sẵn sàng của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-02
      - TBD-06
      - TBD-08
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
            example:
              availability: offline
      x-codeSamples:
      - lang: cURL
        label: Đổi trạng thái sẵn sàng của tài xế
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/availability'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"availability\": \"offline\"}'"
      security:
      - BearerAuth: []
  /drivers/{driverId}/location:
    put:
      tags:
      - MVP-02
      summary: Gửi vị trí mới của tài xế
      operationId: updateDriverLocation
      description: 'Ghi nhận tọa độ và recordedAt. Không dùng bản tin cũ hơn để ghi đè vị trí mới nhất; bản tin
        lặp không tạo tác động điều phối trùng.


        Quyền: Chính tài xế. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-06.'
      x-function: updateDriverLocation
      x-functional-requirements:
      - FR-04
      x-authorization: Chính tài xế
      x-status: proposed-contract
      responses:
        '200':
          description: Gửi vị trí mới của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
              example:
                driverId: 11111111-1111-4111-8111-111111111111
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
                recordedAt: '2026-09-13T08:00:00Z'
                receivedAt: '2026-09-13T08:00:00Z'
                freshness: fresh
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-06
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
            example:
              coordinates:
                latitude: 10.7769
                longitude: 106.7009
              recordedAt: '2026-09-13T08:00:00Z'
      x-codeSamples:
      - lang: cURL
        label: Gửi vị trí mới của tài xế
        source: "curl -X PUT 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/location'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"coordinates\": {\"latitude\": 10.7769, \"longitude\": 106.7009},\
          \ \"recordedAt\": \"2026-09-13T08:00:00Z\"}'"
      security:
      - BearerAuth: []
    get:
      tags:
      - MVP-02
      summary: Lấy vị trí hiện có của tài xế
      operationId: getDriverLocation
      description: 'Trả vị trí và độ mới; chưa có vị trí trả 404 LOCATION_NOT_FOUND. Khách chỉ lấy vị trí tài xế
        chuyến của mình qua tracking.


        Quyền: Chính tài xế hoặc operator/admin có drivers:location:read. Đề xuất thiết kế API; cần xác nhận chính
        sách tại TBD-06, TBD-07.'
      x-function: getDriverLocation
      x-functional-requirements:
      - FR-04
      - FR-21
      x-authorization: Chính tài xế hoặc operator/admin có drivers:location:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy vị trí hiện có của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
              example:
                driverId: 11111111-1111-4111-8111-111111111111
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
                recordedAt: '2026-09-13T08:00:00Z'
                receivedAt: '2026-09-13T08:00:00Z'
                freshness: fresh
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-06
      - TBD-07
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy vị trí hiện có của tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/location'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /service-types:
    get:
      tags:
      - MVP-02
      summary: Lấy danh sách loại xe/dịch vụ
      operationId: listServiceTypes
      description: 'Chỉ trả loại dịch vụ đang cho phép đặt xe; dữ liệu phục vụ lựa chọn trong tạo chuyến.


        Quyền: Tài khoản đã đăng nhập. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-14.'
      x-function: listServiceTypes
      x-functional-requirements:
