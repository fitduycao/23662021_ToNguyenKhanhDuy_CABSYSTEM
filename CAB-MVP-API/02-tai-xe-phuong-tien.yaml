      schema:
        type: integer
        description: Trang
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
      schema:
        type: integer
        description: Kích thước trang
        example: 20
        minimum: 1
        maximum: 100
        default: 20
