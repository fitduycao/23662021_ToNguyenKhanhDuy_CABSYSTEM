openapi: 3.0.3
info:
  title: MVP-07 — Lịch sử và đánh giá
  version: 0.2.0
  description: Đặc tả API đề xuất cho CAB theo module MVP của SRS. File độc lập để nhập Swagger Editor. Các chính
    sách TBD chưa phải yêu cầu đã phê duyệt; URL chỉ minh họa, chưa có backend.
servers:
- url: https://api.cab.example.com/api/v1
  description: Máy chủ minh họa
security:
- BearerAuth: []
paths:
  /trips/{tripId}/ratings:
    post:
      tags:
      - MVP-07
      summary: Đánh giá tài xế sau chuyến
      operationId: createTripRating
      description: 'Chỉ khi completed; không bắt buộc thanh toán thành công. driverId/customerId lấy từ chuyến/token.
        Đề xuất một đánh giá mỗi chuyến, trùng trả 409 RATING_EXISTS; cần chốt tại TBD-10.


        Quyền: Khách sở hữu chuyến. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-10.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: createTripRating
      x-functional-requirements:
      - FR-12
      x-authorization: Khách sở hữu chuyến
      x-status: proposed-contract
      responses:
        '201':
          description: Đánh giá tài xế sau chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                score: 5
                comment: Tài xế đến đúng điểm đón.
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-10
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
            example:
              score: 5
              comment: Tài xế đến đúng điểm đón.
      x-codeSamples:
      - lang: cURL
        label: Đánh giá tài xế sau chuyến
        source: "curl -X POST 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/ratings'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001' \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"score\": 5, \"comment\"\
          : \"Tài xế đến đúng điểm đón.\"}'"
      security:
      - BearerAuth: []
    get:
      tags:
      - MVP-07
      summary: Lấy đánh giá của chuyến
      operationId: listTripRatings
      description: 'Tra cứu đánh giá phục vụ màn hình sau chuyến. Không mặc định công khai toàn bộ nhận xét cá nhân.


        Quyền: Khách của chuyến; vai trò khác theo quyền đã duyệt. Đề xuất thiết kế API; cần xác nhận chính sách
        tại TBD-10, TBD-11.'
      x-function: listTripRatings
      x-functional-requirements:
      - FR-12
      x-authorization: Khách của chuyến; vai trò khác theo quyền đã duyệt
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy đánh giá của chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  customerId: 11111111-1111-4111-8111-111111111111
                  driverId: 11111111-1111-4111-8111-111111111111
                  score: 5
                  comment: Tài xế đến đúng điểm đón.
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-10
      - TBD-11
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy đánh giá của chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/ratings'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
  /trips:
    get:
      tags:
      - MVP-07
      summary: Lấy danh sách/lịch sử chuyến đi
      operationId: listTrips
      description: 'Lọc theo trạng thái trong phạm vi quyền, có phân trang. Số tiền và kết quả thanh toán xem qua
        fare và payments của từng chuyến.


        Quyền: Khách xem chuyến của mình; tài xế xem chuyến được phân công; vận hành có trips:read. Kiểm tra quyền
        và phạm vi tài nguyên tại máy chủ.'
      x-function: listTrips
      x-functional-requirements:
      - FR-11
      - FR-21
      x-authorization: Khách xem chuyến của mình; tài xế xem chuyến được phân công; vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách/lịch sử chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  customerId: 11111111-1111-4111-8111-111111111111
                  serviceTypeId: 11111111-1111-4111-8111-111111111111
                  pickup:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  destination:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  status: searching
                  createdAt: '2026-09-13T08:00:00Z'
                  updatedAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        required: false
        description: Trạng thái chuyến, độc lập với trạng thái thanh toán
        schema:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách/lịch sử chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
components:
  schemas:
    Rating:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tripId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        customerId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        score:
          type: integer
          description: Thang điểm đề xuất 1–5
          example: 5
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: Nhận xét nếu có
          example: Tài xế đến đúng điểm đón.
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - tripId
      - customerId
      - driverId
      - score
      - createdAt
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    RatingRequest:
      type: object
      additionalProperties: false
      properties:
        score:
          type: integer
          description: Thang 1–5 là đề xuất, chờ TBD-10
          example: 5
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: Nhận xét tùy chọn
          example: Tài xế đến đúng điểm đón.
      required:
      - score
    RatingPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    TripPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    Trip:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        customerId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        pickup:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        status:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
        updatedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - customerId
      - serviceTypeId
      - pickup
      - destination
      - status
      - createdAt
      - updatedAt
    Place:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          description: Địa chỉ hiển thị
          example: Điểm đón mẫu, TP.HCM
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
      required:
      - address
      - coordinates
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ
          example: 106.7009
      required:
      - latitude
      - longitude
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống xử lý lặp do client tạo. Phạm vi chủ thể + operationId; payload khác cùng key trả
        409. Thời hạn lưu theo cấu hình đã duyệt.
      schema:
        type: string
        description: Khóa yêu cầu
        example: example-request-001
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: Trang bắt đầu từ 1; mặc định đề xuất 1.
      schema:
        type: integer
        description: Trang
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
      schema:
        type: integer
        description: Kích thước trang
        example: 20
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
tags:
- name: MVP-07
  description: Lịch sử và đánh giá
