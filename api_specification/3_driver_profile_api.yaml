openapi: 3.0.3
info:
  title: Hồ sơ tài xế và phương tiện API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /drivers/{driverId}:
    get:
      tags:
      - driver_profile
      summary: Lấy chi tiết tài xế
      operationId: getDriverById
      description: 'Hồ sơ đầy đủ chỉ cho tài xế đó và vận hành; khách xem thông tin phục vụ qua tracking.


        Quyền: Chính tài xế hoặc operator/admin có drivers:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getDriverById
      x-functional-requirements:
      - FR-02
      - FR-21
      x-authorization: Chính tài xế hoặc operator/admin có drivers:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111' \\\
          \n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    patch:
      tags:
      - driver_profile
      summary: Cập nhật hồ sơ tài xế
      operationId: updateDriver
      description: 'Cập nhật hồ sơ và đồng bộ trường tài khoản tương ứng; không thay đổi phân công hoặc trạng thái
        busy.


        Quyền: Chính tài xế hoặc operator/admin có drivers:update. Đề xuất thiết kế API; cần xác nhận chính sách
        tại TBD-08.'
      x-function: updateDriver
      x-functional-requirements:
      - FR-02
      - FR-20
      x-authorization: Chính tài xế hoặc operator/admin có drivers:update
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật hồ sơ tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
      x-codeSamples:
      - lang: cURL
        label: Cập nhật hồ sơ tài xế
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /drivers/{driverId}/availability:
    patch:
      tags:
      - driver_profile
      summary: Đổi trạng thái sẵn sàng của tài xế
      operationId: updateDriverAvailability
      description: 'Chỉ cho chọn available/offline. busy do hệ thống quản lý; không cho available khi có phân công
        đang hiệu lực. Kiểm tra tài khoản và phương tiện đủ điều kiện.


        Quyền: Chính tài xế. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-02, TBD-06, TBD-08.'
      x-function: updateDriverAvailability
      x-functional-requirements:
      - FR-04
      x-authorization: Chính tài xế
      x-status: proposed-contract
      responses:
        '200':
          description: Đổi trạng thái sẵn sàng của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: available
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-02
      - TBD-06
      - TBD-08
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
            example:
              availability: offline
      x-codeSamples:
      - lang: cURL
        label: Đổi trạng thái sẵn sàng của tài xế
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/availability'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"availability\": \"offline\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /vehicles:
    post:
      tags:
      - driver_profile
      summary: Tạo mới phương tiện
      operationId: createVehicle
      description: 'Kiểm tra chủ sở hữu và loại dịch vụ hợp lệ; trùng biển số trả 409 VEHICLE_EXISTS. Điều kiện
        duyệt trước nhận chuyến theo TBD-08.


        Quyền: Chính tài xế sở hữu driverId hoặc operator/admin có vehicles:create. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-08.'
      x-function: createVehicle
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chính tài xế sở hữu driverId hoặc operator/admin có vehicles:create
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo mới phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            example:
              driverId: 11111111-1111-4111-8111-111111111111
              serviceTypeId: 11111111-1111-4111-8111-111111111111
              plateNumber: 51A-123.45
              model: Toyota Vios
      x-codeSamples:
      - lang: cURL
        label: Tạo mới phương tiện
        source: "curl -X POST 'https://api.cab.example.com/api/v1/vehicles' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"driverId\": \"11111111-1111-4111-8111-111111111111\", \"serviceTypeId\": \"11111111-1111-4111-8111-111111111111\"\
          , \"plateNumber\": \"51A-123.45\", \"model\": \"Toyota Vios\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    get:
      tags:
      - driver_profile
      summary: Lấy danh sách phương tiện
      operationId: listVehicles
      description: 'Máy chủ tự giới hạn phạm vi theo tài khoản. Lọc driverId không được vượt quyền.


        Quyền: Tài xế xem xe của mình; operator/admin có vehicles:read. Kiểm tra quyền và phạm vi tài nguyên tại
        máy chủ.'
      x-function: listVehicles
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Tài xế xem xe của mình; operator/admin có vehicles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  driverId: 11111111-1111-4111-8111-111111111111
                  serviceTypeId: 11111111-1111-4111-8111-111111111111
                  plateNumber: 51A-123.45
                  model: Toyota Vios
                  status: active
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: driverId
        in: query
        required: false
        description: Mã định danh
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: status
        in: query
        required: false
        description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
        schema:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách phương tiện
        source: "curl -X GET 'https://api.cab.example.com/api/v1/vehicles' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /vehicles/{vehicleId}:
    get:
      tags:
      - driver_profile
      summary: Lấy chi tiết phương tiện
      operationId: getVehicleById
      description: 'Tra cứu phương tiện trong phạm vi quyền.


        Quyền: Chủ phương tiện hoặc operator/admin có vehicles:read. Kiểm tra quyền và phạm vi tài nguyên tại máy
        chủ.'
      x-function: getVehicleById
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chủ phương tiện hoặc operator/admin có vehicles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết phương tiện
        source: "curl -X GET 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    patch:
      tags:
      - driver_profile
      summary: Cập nhật phương tiện
      operationId: updateVehicle
      description: 'Không đổi chủ qua endpoint này. Xe đang phục vụ trả 409 VEHICLE_IN_USE nếu thay đổi ảnh hưởng
        chuyến.


        Quyền: Chủ phương tiện hoặc operator/admin có vehicles:update. Đề xuất thiết kế API; cần xác nhận chính
        sách tại TBD-08.'
      x-function: updateVehicle
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chủ phương tiện hoặc operator/admin có vehicles:update
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
            example:
              serviceTypeId: 11111111-1111-4111-8111-111111111111
              plateNumber: 51A-123.45
              model: Toyota Vios
      x-codeSamples:
      - lang: cURL
        label: Cập nhật phương tiện
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"serviceTypeId\": \"11111111-1111-4111-8111-111111111111\", \"plateNumber\"\
          : \"51A-123.45\", \"model\": \"Toyota Vios\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    delete:
      tags:
      - driver_profile
      summary: Xóa mềm phương tiện
      operationId: deactivateVehicle
      description: 'Đề xuất CRUD: đặt inactive, giữ tham chiếu lịch sử. Xe đang phục vụ trả 409 VEHICLE_IN_USE.
        Gọi lặp trả 204.


        Quyền: operator/admin có vehicles:deactivate. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07,
        TBD-11.'
      x-function: deactivateVehicle
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có vehicles:deactivate
      x-status: proposed-extension
      responses:
        '204':
          description: Thực hiện thành công, không có response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Xóa mềm phương tiện
        source: "curl -X DELETE 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
components:
  schemas:
    Driver:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã tài xế
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        accountId:
          type: string
          description: Mã tài khoản
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
        availability:
          type: string
          description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
          example: available
          enum:
          - offline
          - available
          - busy
      required:
      - id
      - accountId
      - fullName
      - phone
      - status
      - availability
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
      minProperties: 1
    AvailabilityRequest:
      type: object
      additionalProperties: false
      properties:
        availability:
          type: string
          description: Chỉ thay đổi trạng thái chủ động; không được bật available nếu có chuyến đang phục vụ
          example: offline
          enum:
          - offline
          - available
      required:
      - availability
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        plateNumber:
          type: string
          description: Biển số; quy tắc kiểm tra TBD-08
          example: 51A-123.45
        model:
          type: string
          description: Mẫu xe
          example: Toyota Vios
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      required:
      - id
      - driverId
      - serviceTypeId
      - plateNumber
      - model
      - status
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        plateNumber:
          type: string
          description: Biển số
          example: 51A-123.45
          minLength: 1
        model:
          type: string
          description: Mẫu xe
          example: Toyota Vios
          minLength: 1
      required:
      - driverId
      - serviceTypeId
      - plateNumber
      - model
    VehiclePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      properties:
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        plateNumber:
          type: string
          description: Biển số
          example: 51A-123.45
          minLength: 1
        model:
          type: string
          description: Mẫu xe
          example: Toyota Vios
          minLength: 1
      minProperties: 1
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Trang bắt đầu từ 1; mặc định đề xuất 1.
      schema:
        type: integer
        description: Trang
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
      schema:
        type: integer
        description: Kích thước trang
        example: 20
        minimum: 1
        maximum: 100
        default: 20
tags:
- name: driver_profile
  description: Hồ sơ tài xế và phương tiện
