openapi: 3.0.3
info:
  title: Xác thực API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /auth/register:
    post:
      tags:
      - auth
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      description: 'Tạo mới tài khoản khách hàng. Số điện thoại trùng trả 409 ACCOUNT_EXISTS. Không được truyền
        vai trò quản trị.


        Quyền: Công khai; luôn tạo vai trò customer. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: registerCustomer
      x-functional-requirements:
      - FR-01
      x-authorization: Công khai; luôn tạo vai trò customer
      x-status: proposed-contract
      responses:
        '201':
          description: Đăng ký tài khoản khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Đăng ký tài khoản khách hàng
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/register' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\"\
          : \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"}'"
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /auth/drivers/register:
    post:
      tags:
      - auth
      summary: Tài xế tự đăng ký
      operationId: registerDriver
      description: 'Tạo tài khoản và hồ sơ tài xế trong cùng giao dịch. Trạng thái đủ điều kiện nhận xe phải theo
        chính sách duyệt, không tự bật available.


        Quyền: Công khai; luôn tạo vai trò driver. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: registerDriver
      x-functional-requirements:
      - FR-02
      x-authorization: Công khai; luôn tạo vai trò driver
      x-status: proposed-contract
      responses:
        '201':
          description: Tài xế tự đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: offline
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Tài xế tự đăng ký
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/drivers/register' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\"\
          : \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"}'"
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /auth/login:
    post:
      tags:
      - auth
      summary: Đăng nhập
      operationId: login
      description: 'Xác thực số điện thoại/mật khẩu. Thông tin sai hoặc tài khoản không còn hoạt động trả 401 với
        thông báo chung; không tiết lộ tài khoản có tồn tại hay không.


        Quyền: Khách hàng, tài xế, vận hành và quản trị. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: login
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Khách hàng, tài xế, vận hành và quản trị
      x-status: proposed-contract
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                accessToken: EXAMPLE_ACCESS_TOKEN
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  role: customer
                  status: active
                  createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Đăng nhập
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/login' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"phone\": \"+84901234567\", \"password\":\
          \ \"ExampleOnly_ChangeMe_123!\"}'"
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã tài khoản
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        role:
          type: string
          description: Vai trò; ma trận quyền chi tiết TBD-11
          example: customer
          enum:
          - customer
          - driver
          - operator
          - admin
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - fullName
      - phone
      - role
      - status
      - createdAt
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    Registration:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        password:
          type: string
          description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
          example: ExampleOnly_ChangeMe_123!
          minLength: 1
          writeOnly: true
      required:
      - fullName
      - phone
      - password
      description: Đề xuất dùng điện thoại/mật khẩu; không cho client truyền role hoặc trạng thái đặc quyền.
    Driver:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã tài xế
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        accountId:
          type: string
          description: Mã tài khoản
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
        availability:
          type: string
          description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
          example: available
          enum:
          - offline
          - available
          - busy
      required:
      - id
      - accountId
      - fullName
      - phone
      - status
      - availability
    LoginResult:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: Bearer token minh họa, không phải token thật
          example: EXAMPLE_ACCESS_TOKEN
        tokenType:
          type: string
          description: Loại token
          example: Bearer
          enum:
          - Bearer
        expiresIn:
          type: integer
          description: Thời gian hiệu lực theo giây; ví dụ, chính sách thực tế TBD-08
          example: 3600
          minimum: 1
        user:
          $ref: '#/components/schemas/User'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        password:
          type: string
          description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
          example: ExampleOnly_ChangeMe_123!
          minLength: 1
          writeOnly: true
      required:
      - phone
      - password
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
tags:
- name: auth
  description: Xác thực
