openapi: 3.0.3
info:
  title: Vị trí và theo dõi API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /drivers/{driverId}/location:
    put:
      tags:
      - location
      summary: Gửi vị trí mới của tài xế
      operationId: updateDriverLocation
      description: 'Ghi nhận tọa độ và recordedAt. Không dùng bản tin cũ hơn để ghi đè vị trí mới nhất; bản tin
        lặp không tạo tác động điều phối trùng.


        Quyền: Chính tài xế. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-06.'
      x-function: updateDriverLocation
      x-functional-requirements:
      - FR-04
      x-authorization: Chính tài xế
      x-status: proposed-contract
      responses:
        '200':
          description: Gửi vị trí mới của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
              example:
                driverId: 11111111-1111-4111-8111-111111111111
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
                recordedAt: '2026-09-13T08:00:00Z'
                receivedAt: '2026-09-13T08:00:00Z'
                freshness: fresh
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-06
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
            example:
              coordinates:
                latitude: 10.7769
                longitude: 106.7009
              recordedAt: '2026-09-13T08:00:00Z'
      x-codeSamples:
      - lang: cURL
        label: Gửi vị trí mới của tài xế
        source: "curl -X PUT 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/location'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"coordinates\": {\"latitude\": 10.7769, \"longitude\": 106.7009},\
          \ \"recordedAt\": \"2026-09-13T08:00:00Z\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
    get:
      tags:
      - location
      summary: Lấy vị trí hiện có của tài xế
      operationId: getDriverLocation
      description: 'Trả vị trí và độ mới; chưa có vị trí trả 404 LOCATION_NOT_FOUND. Khách chỉ lấy vị trí tài xế
        chuyến của mình qua tracking.


        Quyền: Chính tài xế hoặc operator/admin có drivers:location:read. Đề xuất thiết kế API; cần xác nhận chính
        sách tại TBD-06, TBD-07.'
      x-function: getDriverLocation
      x-functional-requirements:
      - FR-04
      - FR-21
      x-authorization: Chính tài xế hoặc operator/admin có drivers:location:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy vị trí hiện có của tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
              example:
                driverId: 11111111-1111-4111-8111-111111111111
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
                recordedAt: '2026-09-13T08:00:00Z'
                receivedAt: '2026-09-13T08:00:00Z'
                freshness: fresh
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-06
      - TBD-07
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy vị trí hiện có của tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111/location'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /trips/{tripId}/tracking:
    get:
      tags:
      - location
      summary: Theo dõi tài xế, ETA và trạng thái chuyến
      operationId: trackTrip
      description: 'Chỉ trả driver sau phân công hợp lệ. ETA không khả dụng trả null; vị trí có freshness. Dừng
        lộ vị trí trực tiếp sau khi chuyến kết thúc theo quyền lưu trữ.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-06, TBD-07.'
      x-function: trackTrip
      x-functional-requirements:
      - FR-09
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Theo dõi tài xế, ETA và trạng thái chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'
              example:
                tripId: 11111111-1111-4111-8111-111111111111
                status: assigned
                driver:
                  id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  vehiclePlateNumber: 51A-123.45
                  vehicleModel: Toyota Vios
                etaSeconds: 300
                location:
                  driverId: 11111111-1111-4111-8111-111111111111
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                  recordedAt: '2026-09-13T08:00:00Z'
                  receivedAt: '2026-09-13T08:00:00Z'
                  freshness: fresh
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-06
      - TBD-07
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Theo dõi tài xế, ETA và trạng thái chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/tracking'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
components:
  schemas:
    DriverLocation:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        recordedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
        receivedAt:
          type: string
          description: Thời điểm máy chủ nhận vị trí
          example: '2026-09-13T08:00:00Z'
          format: date-time
        freshness:
          type: string
          description: Độ mới theo chính sách TBD-06
          example: fresh
          enum:
          - fresh
          - stale
          - unknown
      required:
      - driverId
      - coordinates
      - recordedAt
      - receivedAt
      - freshness
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ
          example: 106.7009
      required:
      - latitude
      - longitude
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    LocationUpdate:
      type: object
      additionalProperties: false
      properties:
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        recordedAt:
          type: string
          description: Thời điểm thiết bị ghi vị trí; kiểm tra độ mới theo TBD-06
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - coordinates
      - recordedAt
    Tracking:
      type: object
      additionalProperties: false
      properties:
        tripId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        status:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
        driver:
          allOf:
          - $ref: '#/components/schemas/DriverPublic'
          description: Chỉ có khi đã có phân công được xác nhận
        etaSeconds:
          type: integer
          description: ETA tính theo giây; null khi không có dữ liệu đáng tin cậy
          example: 300
          minimum: 0
          nullable: true
        location:
          allOf:
          - $ref: '#/components/schemas/DriverLocation'
          description: Chỉ có nếu có dữ liệu và người gọi được quyền xem
        updatedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - tripId
      - status
      - etaSeconds
      - updatedAt
    DriverPublic:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        vehiclePlateNumber:
          type: string
          description: Biển số xe phục vụ
          example: 51A-123.45
        vehicleModel:
          type: string
          description: Mẫu xe phục vụ
          example: Toyota Vios
      required:
      - id
      - fullName
      - vehiclePlateNumber
      - vehicleModel
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
tags:
- name: location
  description: Vị trí và theo dõi
