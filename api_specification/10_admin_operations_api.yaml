        source: "curl -X POST 'https://api.cab.example.com/api/v1/operations/support-cases/11111111-1111-4111-8111-111111111111/resolution'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001' \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"resolutionNote\": \"\
          Đã kiểm tra và hướng dẫn khách đồng bộ lại.\"}'"
      security:
      - BearerAuth: []
