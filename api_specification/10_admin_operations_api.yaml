openapi: 3.0.3
info:
  title: Vận hành và báo cáo API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /audit-logs:
    get:
      tags:
      - admin_operations
      summary: Tra cứu nhật ký thao tác quan trọng
      operationId: listAuditLogs
      description: 'Audit được ghi tự động từ thao tác quan trọng; không cung cấp API công khai tạo/sửa/xóa log.
        Không ghi mật khẩu, token, chữ ký hoặc dữ liệu thanh toán nhạy cảm.


        Quyền: admin hoặc người có audit:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: listAuditLogs
      x-functional-requirements:
      - FR-26
      x-authorization: admin hoặc người có audit:read
      x-status: proposed-contract
      responses:
        '200':
          description: Tra cứu nhật ký thao tác quan trọng thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  actorReference: system:dispatch
                  action: trip.assigned
                  entityReference: trip:11111111-1111-4111-8111-111111111111
                  result: success
                  occurredAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: entityReference
        in: query
        required: false
        description: Lọc đối tượng
        schema:
          type: string
          description: Lọc đối tượng
          example: trip:11111111-1111-4111-8111-111111111111
      x-codeSamples:
      - lang: cURL
        label: Tra cứu nhật ký thao tác quan trọng
        source: "curl -X GET 'https://api.cab.example.com/api/v1/audit-logs' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /audit-logs/{auditId}:
    get:
      tags:
      - admin_operations
      summary: Lấy chi tiết một bản ghi audit
      operationId: getAuditLogById
      description: 'Đọc bản ghi trong phạm vi được cấp quyền; không tiết lộ bí mật kỹ thuật.


        Quyền: admin hoặc người có audit:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: getAuditLogById
      x-functional-requirements:
      - FR-26
      x-authorization: admin hoặc người có audit:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết một bản ghi audit thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
              example:
                id: 11111111-1111-4111-8111-111111111111
                actorReference: system:dispatch
                action: trip.assigned
                entityReference: trip:11111111-1111-4111-8111-111111111111
                result: success
                occurredAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: auditId
        in: path
        required: true
        description: Mã auditId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết một bản ghi audit
        source: "curl -X GET 'https://api.cab.example.com/api/v1/audit-logs/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /notifications:
    get:
      tags:
      - admin_operations
      summary: Lấy danh sách thông báo của tôi
      operationId: listMyNotifications
      description: 'Chỉ lấy thông báo của chủ token. Các sự kiện nghiệp vụ được tạo ở máy chủ và chuyển qua kênh
        đã chọn; GET chỉ là kênh đọc lại, không thay thế cơ chế phát thông báo nền.


        Quyền: Tài khoản đang đăng nhập. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-09.'
      x-function: listMyNotifications
      x-functional-requirements:
      - FR-18
      - FR-19
      x-authorization: Tài khoản đang đăng nhập
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách thông báo của tôi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  eventType: booking_received
                  message: Yêu cầu đặt xe đã được tiếp nhận.
                  deliveryStatus: pending
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-09
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách thông báo của tôi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/notifications' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /notifications/{notificationId}:
    get:
      tags:
      - admin_operations
      summary: Lấy chi tiết thông báo
      operationId: getNotificationById
      description: 'Không cho đọc thông báo của tài khoản khác.


        Quyền: Chủ thông báo. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getNotificationById
      x-functional-requirements:
      - FR-18
      - FR-19
      x-authorization: Chủ thông báo
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết thông báo thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                eventType: booking_received
                message: Yêu cầu đặt xe đã được tiếp nhận.
                deliveryStatus: pending
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Mã notificationId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết thông báo
        source: "curl -X GET 'https://api.cab.example.com/api/v1/notifications/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /operations/transactions:
    get:
      tags:
      - admin_operations
      summary: Tra cứu lịch sử giao dịch vận hành
      operationId: listTransactions
      description: 'Tra cứu giao dịch tập trung theo chuyến/trạng thái; chỉ trả dữ liệu trong phạm vi quyền.


        Quyền: operator/admin có payments:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.


        checkoutUrl chỉ trả cho khách sở hữu giao dịch; trả null cho tài xế/vận hành. Không ghi URL chứa token vào
        log.'
      x-function: listTransactions
      x-functional-requirements:
      - FR-23
      x-authorization: operator/admin có payments:read
      x-status: proposed-contract
      responses:
        '200':
          description: Tra cứu lịch sử giao dịch vận hành thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  method: electronic
                  amount: 125000
                  currency: VND
                  status: processing
                  providerReference: provider_tx_example
                  checkoutUrl: https://payments.example.com/checkout/example
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: tripId
        in: query
        required: false
        description: Mã định danh
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: status
        in: query
        required: false
        description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
        schema:
          type: string
          description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
          example: processing
          enum:
          - pending
          - processing
          - succeeded
          - failed
      x-codeSamples:
      - lang: cURL
        label: Tra cứu lịch sử giao dịch vận hành
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/transactions' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /operations/support-cases:
    post:
      tags:
      - admin_operations
      summary: Ghi nhận sự cố chuyến đi
      operationId: createSupportCase
      description: 'Đề xuất tài nguyên hỗ trợ để ghi nhận sự cố. Không tự ý sửa phân công, cước hoặc kết quả thanh
        toán.


        Quyền: operator/admin có support:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.'
      x-function: createSupportCase
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:create
      x-status: proposed-contract
      responses:
        '201':
          description: Ghi nhận sự cố chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCase'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                description: Khách báo chưa thấy cập nhật trạng thái.
                status: open
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportCaseRequest'
            example:
              tripId: 11111111-1111-4111-8111-111111111111
              description: Khách báo chưa thấy cập nhật trạng thái.
      x-codeSamples:
      - lang: cURL
        label: Ghi nhận sự cố chuyến đi
        source: "curl -X POST 'https://api.cab.example.com/api/v1/operations/support-cases' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"tripId\": \"11111111-1111-4111-8111-111111111111\", \"description\": \"Khách báo chưa thấy\
          \ cập nhật trạng thái.\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
    get:
      tags:
      - admin_operations
      summary: Lấy danh sách sự cố chuyến đi
      operationId: listSupportCases
      description: 'Danh sách sự cố đã ghi nhận, có phân trang.


        Quyền: operator/admin có support:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listSupportCases
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách sự cố chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCasePage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  description: Khách báo chưa thấy cập nhật trạng thái.
                  status: open
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        required: false
        description: Trạng thái xử lý
        schema:
          type: string
          description: Trạng thái xử lý
          example: open
          enum:
          - open
          - resolved
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách sự cố chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/support-cases' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /operations/support-cases/{caseId}:
    get:
      tags:
      - admin_operations
      summary: Lấy chi tiết sự cố
      operationId: getSupportCaseById
      description: 'Tra cứu sự cố cùng tripId để mở chi tiết chuyến/giao dịch.


        Quyền: operator/admin có support:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getSupportCaseById
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết sự cố thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCase'
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                description: Khách báo chưa thấy cập nhật trạng thái.
                status: open
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: caseId
        in: path
        required: true
        description: Mã caseId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết sự cố
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/support-cases/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /operations/support-cases/{caseId}/resolution:
    post:
      tags:
      - admin_operations
      summary: Ghi nhận kết quả hỗ trợ
      operationId: resolveSupportCase
      description: 'Đóng hồ sơ hỗ trợ và lưu ghi chú/audit. Đây không phải quyền sửa tùy ý trạng thái chuyến; thao
        tác khắc phục có tác động nghiệp vụ khác phải được chốt ở TBD-11.


        Quyền: operator/admin có support:resolve. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.


