openapi: 3.0.3
info:
  title: Thực hiện chuyến API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /trips/{tripId}:
    get:
      tags:
      - trip_execution
      summary: Lấy chi tiết một chuyến đi
      operationId: getTripById
      description: 'Trả trạng thái hiện tại; no_driver/cancelled/completed là kết quả riêng, không bị thay đổi bởi
        lỗi thanh toán.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Kiểm tra quyền và phạm vi tài
        nguyên tại máy chủ.'
      x-function: getTripById
      x-functional-requirements:
      - FR-09
      - FR-11
      - FR-21
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết một chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: searching
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết một chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111' \\\n\
          \  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /trips/{tripId}/status:
    patch:
      tags:
      - trip_execution
      summary: Cập nhật quá trình thực hiện chuyến
      operationId: updateTripStatus
      description: 'Kiểm tra expectedStatus và thứ tự assigned → arrived → picked_up → in_progress → completed.
        Sai thứ tự trả 409 INVALID_TRIP_TRANSITION. Khi completed, kích hoạt tính cước và thông báo qua sự kiện
        bền vững. Lặp cùng cập nhật không tính cước hoặc gửi sự kiện lần hai.


        Quyền: Tài xế đang được phân công. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: updateTripStatus
      x-functional-requirements:
      - FR-10
      - FR-13
      - FR-18
      - FR-19
      x-authorization: Tài xế đang được phân công
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật quá trình thực hiện chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: arrived
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusUpdate'
            example:
              status: arrived
              expectedStatus: assigned
      x-codeSamples:
      - lang: cURL
        label: Cập nhật quá trình thực hiện chuyến
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/status'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"status\": \"arrived\", \"expectedStatus\": \"assigned\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
  /trips/{tripId}/status-history:
    get:
      tags:
      - trip_execution
      summary: Lấy lịch sử trạng thái chuyến
      operationId: listTripStatusHistory
      description: 'Lấy các trạng thái và thời điểm ghi nhận theo thứ tự thời gian.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Kiểm tra quyền và phạm vi tài
        nguyên tại máy chủ.'
      x-function: listTripStatusHistory
      x-functional-requirements:
      - FR-10
      - FR-21
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy lịch sử trạng thái chuyến thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStatusEventPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  status: searching
                  changedAt: '2026-09-13T08:00:00Z'
                  changedBy: 11111111-1111-4111-8111-111111111111
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy lịch sử trạng thái chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/status-history'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: extension-after-two-module-mvp
components:
  schemas:
    Trip:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        customerId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        serviceTypeId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        pickup:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        status:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
        updatedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - customerId
      - serviceTypeId
      - pickup
      - destination
      - status
      - createdAt
      - updatedAt
    Place:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          description: Địa chỉ hiển thị
          example: Điểm đón mẫu, TP.HCM
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
      required:
      - address
      - coordinates
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Vĩ độ
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Kinh độ
          example: 106.7009
      required:
      - latitude
      - longitude
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    TripStatusUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Chuyển đúng thứ tự từ assigned; gửi lặp trạng thái hiện tại không phát sinh tác động lần
            hai
          example: arrived
          enum:
          - arrived
          - picked_up
          - in_progress
          - completed
        expectedStatus:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: assigned
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
      required:
      - status
      - expectedStatus
      description: expectedStatus dùng kiểm tra xung đột; máy chủ ghi thời điểm chuẩn.
    TripStatusEventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripStatusEvent'
          description: Danh sách
        page:
          type: integer
          description: Trang hiện tại, bắt đầu từ 1
          example: 1
          minimum: 1
        pageSize:
          type: integer
          description: Số phần tử tối đa mỗi trang
          example: 20
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
          example: 1
          minimum: 0
      required:
      - items
      - page
      - pageSize
      - total
    TripStatusEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        tripId:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        status:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
        changedAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
        changedBy:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - id
      - tripId
      - status
      - changedAt
      - changedBy
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Trang bắt đầu từ 1; mặc định đề xuất 1.
      schema:
        type: integer
        description: Trang
        example: 1
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
      schema:
        type: integer
        description: Kích thước trang
        example: 20
        minimum: 1
        maximum: 100
        default: 20
tags:
- name: trip_execution
  description: Thực hiện chuyến
