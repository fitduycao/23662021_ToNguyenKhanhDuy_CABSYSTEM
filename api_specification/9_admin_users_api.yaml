openapi: 3.0.3
info:
  title: Quản trị người dùng API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /roles:
    get:
      tags:
      - admin_users
      summary: Lấy danh sách vai trò
      operationId: listRoles
      description: 'Tra cứu vai trò đã cấu hình và quyền tương ứng; không cho người thường tự cấp quyền.


        Quyền: admin có roles:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.'
      x-function: listRoles
      x-functional-requirements:
      - FR-24
      x-authorization: admin có roles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách vai trò thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  name: operator
                  permissions:
                  - users:read
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-11
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách vai trò
        source: "curl -X GET 'https://api.cab.example.com/api/v1/roles' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /permissions:
    get:
      tags:
      - admin_users
      summary: Lấy danh mục quyền
      operationId: listPermissions
      description: 'Danh mục quyền do hệ thống định nghĩa. Mỗi endpoint kiểm tra quyền và sở hữu tài nguyên tại
        máy chủ.


        Quyền: admin có roles:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.'
      x-function: listPermissions
      x-functional-requirements:
      - FR-24
      x-authorization: admin có roles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh mục quyền thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPage'
              example:
                items:
                - code: users:read
                  description: Tra cứu khách hàng
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-11
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-codeSamples:
      - lang: cURL
        label: Lấy danh mục quyền
        source: "curl -X GET 'https://api.cab.example.com/api/v1/permissions' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /users/{userId}/roles:
    get:
      tags:
      - admin_users
      summary: Lấy các vai trò của tài khoản
      operationId: getUserRoles
      description: 'Tra cứu các vai trò được gán cho tài khoản.


        Quyền: admin có roles:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getUserRoles
      x-functional-requirements:
      - FR-24
      x-authorization: admin có roles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy các vai trò của tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignments'
              example:
                userId: 11111111-1111-4111-8111-111111111111
                roleIds:
                - 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy các vai trò của tài khoản
        source: "curl -X GET 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111/roles'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    put:
      tags:
      - admin_users
      summary: Gán hoặc thay thế vai trò tài khoản
      operationId: assignUserRoles
      description: 'Đề xuất thao tác nhạy cảm: chỉ gán vai trò được phép; không tự nâng quyền hoặc xóa quản trị
        cuối cùng. Tài khoản nhận vai trò driver/customer phải có hồ sơ tương ứng trước khi gán, nếu thiếu trả 409
        PROFILE_REQUIRED. Cập nhật có hiệu lực với mọi yêu cầu sau đó và ghi audit.


        Quyền: admin có roles:assign. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.'
      x-function: assignUserRoles
      x-functional-requirements:
      - FR-24
      - FR-26
      x-authorization: admin có roles:assign
      x-status: proposed-extension
      responses:
        '200':
          description: Gán hoặc thay thế vai trò tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignments'
              example:
                userId: 11111111-1111-4111-8111-111111111111
                roleIds:
                - 11111111-1111-4111-8111-111111111111
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-11
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
            example:
              roleIds:
              - 11111111-1111-4111-8111-111111111111
      x-codeSamples:
      - lang: cURL
        label: Gán hoặc thay thế vai trò tài khoản
        source: "curl -X PUT 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111/roles'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"roleIds\": [\"11111111-1111-4111-8111-111111111111\"]}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /drivers:
    post:
      tags:
      - admin_users
      summary: Vận hành tạo tài khoản tài xế
      operationId: createDriver
      description: 'Tạo tài khoản và hồ sơ tài xế; vai trò driver do máy chủ đặt. Tài xế mới chưa tự động sẵn sàng
        nhận chuyến.


        Quyền: operator/admin có drivers:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: createDriver
      x-functional-requirements:
      - FR-02
      - FR-20
      x-authorization: operator/admin có drivers:create
      x-status: proposed-contract
      responses:
        '201':
          description: Vận hành tạo tài khoản tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: offline
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Vận hành tạo tài khoản tài xế
        source: "curl -X POST 'https://api.cab.example.com/api/v1/drivers' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  --data\
          \ '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"\
          }'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    get:
      tags:
      - admin_users
      summary: Lấy danh sách tài xế
      operationId: listDrivers
      description: 'Tra cứu tài xế và tình trạng phục vụ, có phân trang.


        Quyền: operator/admin có drivers:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listDrivers
      x-functional-requirements:
      - FR-20
      - FR-21
      x-authorization: operator/admin có drivers:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách tài xế thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  accountId: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  status: active
                  availability: available
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: availability
        in: query
        required: false
        description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
        schema:
          type: string
          description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
          example: available
          enum:
          - offline
          - available
          - busy
      - name: status
        in: query
        required: false
        description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
        schema:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách tài xế
        source: "curl -X GET 'https://api.cab.example.com/api/v1/drivers' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /drivers/{driverId}:
    delete:
      tags:
      - admin_users
      summary: Xóa mềm tài xế
      operationId: deactivateDriver
      description: 'Đề xuất CRUD: vô hiệu hóa tài khoản tài xế, đưa offline, thu hồi phiên; giữ lịch sử. Tài xế
        đang phục vụ hoặc còn xử lý thanh toán trả 409 DRIVER_IN_USE. Gọi lặp trả 204.


        Quyền: admin có drivers:deactivate. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: deactivateDriver
      x-functional-requirements:
      - FR-20
      x-authorization: admin có drivers:deactivate
      x-status: proposed-extension
      responses:
        '204':
          description: Thực hiện thành công, không có response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: driverId
        in: path
        required: true
        description: Mã driverId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Xóa mềm tài xế
        source: "curl -X DELETE 'https://api.cab.example.com/api/v1/drivers/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
  /users:
    post:
      tags:
      - admin_users
      summary: Tạo mới một user khách hàng
      operationId: createUser
      description: 'Vận hành tạo tài khoản khách hàng; role do máy chủ đặt. Tài khoản tài xế dùng POST /drivers.
        Trùng số điện thoại trả 409 ACCOUNT_EXISTS.


        Quyền: operator/admin có users:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: createUser
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:create
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo mới một user khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Tạo mới một user khách hàng
        source: "curl -X POST 'https://api.cab.example.com/api/v1/users' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  --data\
          \ '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"\
          }'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    get:
      tags:
      - admin_users
      summary: Lấy danh sách user khách hàng
      operationId: listUsers
      description: 'Lấy danh sách khách hàng có phân trang. Không cho khách thường đọc danh sách tài khoản.


        Quyền: operator/admin có users:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listUsers
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách user khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  role: customer
                  status: active
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
