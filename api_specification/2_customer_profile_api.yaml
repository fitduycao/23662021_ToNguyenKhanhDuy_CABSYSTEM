openapi: 3.0.3
info:
  title: Hồ sơ khách hàng API
  version: 0.3.0
  description: Đặc tả đề xuất CAB, chia thành 10 nhóm API. File độc lập để nhập Swagger Editor. Đây là hợp đồng
    API, chưa phải backend. FR-01–FR-27 và TBD trong operation thuộc bản phân tích CAB đầy đủ trước khi thu gọn;
    không đồng nhất với FR-MVP trong SRS 2.0. Phần đặt xe/thanh toán là mở rộng ngoài MVP 2 module.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa triển khai
security: []
paths:
  /users/me:
    get:
      tags:
      - customer_profile
      summary: Lấy hồ sơ tài khoản đang đăng nhập
      operationId: getMyProfile
      description: 'Lấy danh tính từ Bearer token; không nhận userId từ client.


        Quyền: Mọi tài khoản đang hoạt động. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getMyProfile
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Mọi tài khoản đang hoạt động
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy hồ sơ tài khoản đang đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-codeSamples:
      - lang: cURL
        label: Lấy hồ sơ tài khoản đang đăng nhập
        source: "curl -X GET 'https://api.cab.example.com/api/v1/users/me' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
    patch:
      tags:
      - customer_profile
      summary: Cập nhật hồ sơ của chính mình
      operationId: updateMyProfile
      description: 'Cập nhật một phần hồ sơ. Không cho sửa role/status/password qua endpoint này.


        Quyền: Chủ tài khoản. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: updateMyProfile
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Chủ tài khoản
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật hồ sơ của chính mình thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tbd:
      - TBD-08
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
      x-codeSamples:
      - lang: cURL
        label: Cập nhật hồ sơ của chính mình
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/users/me' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\"}'"
      security:
      - BearerAuth: []
      x-requirement-baseline: CAB full-scope SRS v1; not SRS v2 FR-MVP
      x-delivery-phase: account-profile-scope; reconcile details with SRS v2 before implementation
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Mã tài khoản
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
        role:
          type: string
          description: Vai trò; ma trận quyền chi tiết TBD-11
          example: customer
          enum:
          - customer
          - driver
          - operator
          - admin
        status:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
        createdAt:
          type: string
          description: Thời điểm UTC theo RFC 3339
          example: '2026-09-13T08:00:00Z'
          format: date-time
      required:
      - id
      - fullName
      - phone
      - role
      - status
      - createdAt
    Error:
      type: object
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Mã lỗi nghiệp vụ
          example: VALIDATION_ERROR
        message:
          type: string
          description: Thông báo dễ hiểu
          example: Dữ liệu không hợp lệ.
        traceId:
          type: string
          description: Mã truy vết lỗi
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      required:
      - errorCode
      - message
      - traceId
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          description: Họ và tên
          example: Nguyễn Văn An
          minLength: 1
        phone:
          type: string
          description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
          example: '+84901234567'
          minLength: 1
      description: Chỉ cập nhật trường gửi lên; thay số điện thoại theo cơ chế xác minh TBD-08.
      minProperties: 1
  responses:
    BadRequest:
      description: Dữ liệu hoặc tham số không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: VALIDATION_ERROR
            message: Dữ liệu hoặc tham số không hợp lệ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: UNAUTHENTICATED
            message: Thiếu, hết hạn hoặc không hợp lệ thông tin xác thực.
            traceId: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: Không đủ quyền hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: FORBIDDEN
            message: Không đủ quyền hoặc không sở hữu tài nguyên.
            traceId: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RESOURCE_NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
            traceId: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: STATE_CONFLICT
            message: Trạng thái xung đột, bản ghi trùng hoặc chính sách chưa được cấu hình.
            traceId: 11111111-1111-4111-8111-111111111111
    Unprocessable:
      description: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: BUSINESS_RULE_VIOLATION
            message: Dữ liệu đúng cấu trúc nhưng không đáp ứng điều kiện nghiệp vụ.
            traceId: 11111111-1111-4111-8111-111111111111
    TooManyRequests:
      description: Vượt giới hạn yêu cầu theo chính sách vận hành.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: RATE_LIMITED
            message: Vượt giới hạn yêu cầu theo chính sách vận hành.
            traceId: 11111111-1111-4111-8111-111111111111
    InternalError:
      description: Lỗi hệ thống; không trả chi tiết nội bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: INTERNAL_ERROR
            message: Lỗi hệ thống; không trả chi tiết nội bộ.
            traceId: 11111111-1111-4111-8111-111111111111
    Unavailable:
      description: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            errorCode: SERVICE_UNAVAILABLE
            message: Thành phần cần thiết tạm không khả dụng; không đồng nghĩa toàn CAB dừng.
            traceId: 11111111-1111-4111-8111-111111111111
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token do đăng nhập cung cấp; không mặc định JWT. Quyền/ownership kiểm tra tại máy chủ.
tags:
- name: customer_profile
  description: Hồ sơ khách hàng
