openapi: 3.0.3
info:
  title: CAB — vehicles
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /vehicles:
    post:
      tags:
      - vehicles
      summary: Tạo mới phương tiện
      operationId: createVehicle
      description: 'Kiểm tra chủ sở hữu và loại dịch vụ hợp lệ; trùng biển số trả 409 VEHICLE_EXISTS. Điều kiện
        duyệt trước nhận chuyến theo TBD-08.


        Quyền: Chính tài xế sở hữu driverId hoặc operator/admin có vehicles:create. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-08.'
      x-function: createVehicle
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chính tài xế sở hữu driverId hoặc operator/admin có vehicles:create
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo mới phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Vehicle
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/CreateVehicleRequest
            example:
              driverId: 11111111-1111-4111-8111-111111111111
              serviceTypeId: 11111111-1111-4111-8111-111111111111
              plateNumber: 51A-123.45
              model: Toyota Vios
      x-codeSamples:
      - lang: cURL
        label: Tạo mới phương tiện
        source: "curl -X POST 'https://api.cab.example.com/api/v1/vehicles' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"driverId\": \"11111111-1111-4111-8111-111111111111\", \"serviceTypeId\": \"11111111-1111-4111-8111-111111111111\"\
          , \"plateNumber\": \"51A-123.45\", \"model\": \"Toyota Vios\"}'"
    get:
      tags:
      - vehicles
      summary: Lấy danh sách phương tiện
      operationId: listVehicles
      description: 'Máy chủ tự giới hạn phạm vi theo tài khoản. Lọc driverId không được vượt quyền.


        Quyền: Tài xế xem xe của mình; operator/admin có vehicles:read. Kiểm tra quyền và phạm vi tài nguyên tại
        máy chủ.'
      x-function: listVehicles
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Tài xế xem xe của mình; operator/admin có vehicles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/VehiclePage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  driverId: 11111111-1111-4111-8111-111111111111
                  serviceTypeId: 11111111-1111-4111-8111-111111111111
                  plateNumber: 51A-123.45
                  model: Toyota Vios
                  status: active
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: driverId
        in: query
        required: false
        description: Mã định danh
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: status
        in: query
        required: false
        description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
        schema:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách phương tiện
        source: "curl -X GET 'https://api.cab.example.com/api/v1/vehicles' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /vehicles/{vehicleId}:
    get:
      tags:
      - vehicles
      summary: Lấy chi tiết phương tiện
      operationId: getVehicleById
      description: 'Tra cứu phương tiện trong phạm vi quyền.


        Quyền: Chủ phương tiện hoặc operator/admin có vehicles:read. Kiểm tra quyền và phạm vi tài nguyên tại máy
        chủ.'
      x-function: getVehicleById
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chủ phương tiện hoặc operator/admin có vehicles:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Vehicle
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết phương tiện
        source: "curl -X GET 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
    patch:
      tags:
      - vehicles
      summary: Cập nhật phương tiện
      operationId: updateVehicle
      description: 'Không đổi chủ qua endpoint này. Xe đang phục vụ trả 409 VEHICLE_IN_USE nếu thay đổi ảnh hưởng
        chuyến.


        Quyền: Chủ phương tiện hoặc operator/admin có vehicles:update. Đề xuất thiết kế API; cần xác nhận chính
        sách tại TBD-08.'
      x-function: updateVehicle
      x-functional-requirements:
      - FR-03
      - FR-20
      x-authorization: Chủ phương tiện hoặc operator/admin có vehicles:update
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật phương tiện thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Vehicle
              example:
                id: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                plateNumber: 51A-123.45
                model: Toyota Vios
                status: active
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/UpdateVehicleRequest
            example:
              serviceTypeId: 11111111-1111-4111-8111-111111111111
              plateNumber: 51A-123.45
              model: Toyota Vios
      x-codeSamples:
      - lang: cURL
        label: Cập nhật phương tiện
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"serviceTypeId\": \"11111111-1111-4111-8111-111111111111\", \"plateNumber\"\
          : \"51A-123.45\", \"model\": \"Toyota Vios\"}'"
    delete:
      tags:
      - vehicles
      summary: Xóa mềm phương tiện
      operationId: deactivateVehicle
      description: 'Đề xuất CRUD: đặt inactive, giữ tham chiếu lịch sử. Xe đang phục vụ trả 409 VEHICLE_IN_USE.
        Gọi lặp trả 204.


        Quyền: operator/admin có vehicles:deactivate. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07,
        TBD-11.'
      x-function: deactivateVehicle
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có vehicles:deactivate
      x-status: proposed-extension
      responses:
        '204':
          description: Thực hiện thành công, không có response body.
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: vehicleId
        in: path
        required: true
        description: Mã vehicleId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Xóa mềm phương tiện
        source: "curl -X DELETE 'https://api.cab.example.com/api/v1/vehicles/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: vehicles
  description: Nhóm chức năng vehicles
