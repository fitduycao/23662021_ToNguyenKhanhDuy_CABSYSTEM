openapi: 3.0.3
info:
  title: CAB — fares
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /trips/{tripId}/fare:
    get:
      tags:
      - fares
      summary: Lấy cước của chuyến đi
      operationId: getTripFare
      description: 'Cước do xử lý nội bộ tính khi completed, không cho khách truyền số tiền. Chưa tính xong trả
        409 FARE_NOT_READY; thiếu chính sách trả 409 POLICY_NOT_CONFIGURED; không tự gán 0 khi lỗi.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có fares:read. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-01.'
      x-function: getTripFare
      x-functional-requirements:
      - FR-11
      - FR-13
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có fares:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy cước của chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Fare
              example:
                tripId: 11111111-1111-4111-8111-111111111111
                amount: 125000
                currency: VND
                calculationReference: fare-policy-example-v1
                calculatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-01
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy cước của chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/fare'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: fares
  description: Nhóm chức năng fares
