openapi: 3.0.3
info:
  title: CAB — service-types
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /service-types:
    get:
      tags:
      - service-types
      summary: Lấy danh sách loại xe/dịch vụ
      operationId: listServiceTypes
      description: 'Chỉ trả loại dịch vụ đang cho phép đặt xe; dữ liệu phục vụ lựa chọn trong tạo chuyến.


        Quyền: Tài khoản đã đăng nhập. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-14.'
      x-function: listServiceTypes
      x-functional-requirements:
      - FR-05
      x-authorization: Tài khoản đã đăng nhập
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách loại xe/dịch vụ thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/ServiceTypePage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  name: Xe 4 chỗ
                  active: true
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-14
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách loại xe/dịch vụ
        source: "curl -X GET 'https://api.cab.example.com/api/v1/service-types' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: service-types
  description: Nhóm chức năng service-types
