openapi: 3.0.3
info:
  title: CAB System API — tài liệu đầu mối
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /auth/register:
    $ref: ./auth/api.yaml#/paths/~1auth~1register
  /auth/drivers/register:
    $ref: ./auth/api.yaml#/paths/~1auth~1drivers~1register
  /auth/login:
    $ref: ./auth/api.yaml#/paths/~1auth~1login
  /users:
    $ref: ./users/api.yaml#/paths/~1users
  /users/me:
    $ref: ./users/api.yaml#/paths/~1users~1me
  /users/{userId}:
    $ref: ./users/api.yaml#/paths/~1users~1{userId}
  /users/{userId}/status:
    $ref: ./users/api.yaml#/paths/~1users~1{userId}~1status
  /drivers:
    $ref: ./drivers/api.yaml#/paths/~1drivers
  /drivers/{driverId}:
    $ref: ./drivers/api.yaml#/paths/~1drivers~1{driverId}
  /drivers/{driverId}/availability:
    $ref: ./drivers/api.yaml#/paths/~1drivers~1{driverId}~1availability
  /drivers/{driverId}/location:
    $ref: ./drivers/api.yaml#/paths/~1drivers~1{driverId}~1location
  /vehicles:
    $ref: ./vehicles/api.yaml#/paths/~1vehicles
  /vehicles/{vehicleId}:
    $ref: ./vehicles/api.yaml#/paths/~1vehicles~1{vehicleId}
  /service-types:
    $ref: ./service-types/api.yaml#/paths/~1service-types
  /trips:
    $ref: ./trips/api.yaml#/paths/~1trips
  /trips/{tripId}:
    $ref: ./trips/api.yaml#/paths/~1trips~1{tripId}
  /trips/{tripId}/tracking:
    $ref: ./trips/api.yaml#/paths/~1trips~1{tripId}~1tracking
  /trips/{tripId}/status:
    $ref: ./trips/api.yaml#/paths/~1trips~1{tripId}~1status
  /trips/{tripId}/status-history:
    $ref: ./trips/api.yaml#/paths/~1trips~1{tripId}~1status-history
  /trips/{tripId}/cancellations:
    $ref: ./trips/api.yaml#/paths/~1trips~1{tripId}~1cancellations
  /dispatch-offers:
    $ref: ./dispatch/api.yaml#/paths/~1dispatch-offers
  /dispatch-offers/{offerId}:
    $ref: ./dispatch/api.yaml#/paths/~1dispatch-offers~1{offerId}
  /dispatch-offers/{offerId}/accept:
    $ref: ./dispatch/api.yaml#/paths/~1dispatch-offers~1{offerId}~1accept
  /dispatch-offers/{offerId}/decline:
    $ref: ./dispatch/api.yaml#/paths/~1dispatch-offers~1{offerId}~1decline
  /trips/{tripId}/fare:
    $ref: ./fares/api.yaml#/paths/~1trips~1{tripId}~1fare
  /trips/{tripId}/payments:
    $ref: ./payments/api.yaml#/paths/~1trips~1{tripId}~1payments
  /payments/{paymentId}:
    $ref: ./payments/api.yaml#/paths/~1payments~1{paymentId}
  /payments/{paymentId}/cash-confirmation:
    $ref: ./payments/api.yaml#/paths/~1payments~1{paymentId}~1cash-confirmation
  /payments/provider-webhook:
    $ref: ./payments/api.yaml#/paths/~1payments~1provider-webhook
  /trips/{tripId}/ratings:
    $ref: ./ratings/api.yaml#/paths/~1trips~1{tripId}~1ratings
  /notifications:
    $ref: ./notifications/api.yaml#/paths/~1notifications
  /notifications/{notificationId}:
    $ref: ./notifications/api.yaml#/paths/~1notifications~1{notificationId}
  /operations/transactions:
    $ref: ./operations/api.yaml#/paths/~1operations~1transactions
  /operations/support-cases:
    $ref: ./operations/api.yaml#/paths/~1operations~1support-cases
  /operations/support-cases/{caseId}:
    $ref: ./operations/api.yaml#/paths/~1operations~1support-cases~1{caseId}
  /operations/support-cases/{caseId}/resolution:
    $ref: ./operations/api.yaml#/paths/~1operations~1support-cases~1{caseId}~1resolution
  /reports/summary:
    $ref: ./reports/api.yaml#/paths/~1reports~1summary
  /reports/driver-performance:
    $ref: ./reports/api.yaml#/paths/~1reports~1driver-performance
  /roles:
    $ref: ./access-control/api.yaml#/paths/~1roles
  /permissions:
    $ref: ./access-control/api.yaml#/paths/~1permissions
  /users/{userId}/roles:
    $ref: ./access-control/api.yaml#/paths/~1users~1{userId}~1roles
  /audit-logs:
    $ref: ./audit-logs/api.yaml#/paths/~1audit-logs
  /audit-logs/{auditId}:
    $ref: ./audit-logs/api.yaml#/paths/~1audit-logs~1{auditId}
components:
  securitySchemes:
    BearerAuth:
      $ref: ./common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ./common/security.yaml#/WebhookSignature
