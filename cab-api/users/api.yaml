openapi: 3.0.3
info:
  title: CAB — users
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /users:
    post:
      tags:
      - users
      summary: Tạo mới một user khách hàng
      operationId: createUser
      description: 'Vận hành tạo tài khoản khách hàng; role do máy chủ đặt. Tài khoản tài xế dùng POST /drivers.
        Trùng số điện thoại trả 409 ACCOUNT_EXISTS.


        Quyền: operator/admin có users:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: createUser
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:create
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo mới một user khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/CreateUserRequest
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Tạo mới một user khách hàng
        source: "curl -X POST 'https://api.cab.example.com/api/v1/users' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n  --data\
          \ '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"\
          }'"
    get:
      tags:
      - users
      summary: Lấy danh sách user khách hàng
      operationId: listUsers
      description: 'Lấy danh sách khách hàng có phân trang. Không cho khách thường đọc danh sách tài khoản.


        Quyền: operator/admin có users:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listUsers
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách user khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/UserPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  role: customer
                  status: active
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: status
        in: query
        required: false
        description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
        schema:
          type: string
          description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
          example: active
          enum:
          - active
          - inactive
      - name: search
        in: query
        required: false
        description: Tìm theo tên hoặc điện thoại trong phạm vi quyền
        schema:
          type: string
          description: Tìm theo tên hoặc điện thoại trong phạm vi quyền
          example: Nguyễn
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách user khách hàng
        source: "curl -X GET 'https://api.cab.example.com/api/v1/users' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /users/me:
    get:
      tags:
      - users
      summary: Lấy hồ sơ tài khoản đang đăng nhập
      operationId: getMyProfile
      description: 'Lấy danh tính từ Bearer token; không nhận userId từ client.


        Quyền: Mọi tài khoản đang hoạt động. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getMyProfile
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Mọi tài khoản đang hoạt động
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy hồ sơ tài khoản đang đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-codeSamples:
      - lang: cURL
        label: Lấy hồ sơ tài khoản đang đăng nhập
        source: "curl -X GET 'https://api.cab.example.com/api/v1/users/me' \\\n  -H 'Accept: application/json' \\\
          \n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
    patch:
      tags:
      - users
      summary: Cập nhật hồ sơ của chính mình
      operationId: updateMyProfile
      description: 'Cập nhật một phần hồ sơ. Không cho sửa role/status/password qua endpoint này.


        Quyền: Chủ tài khoản. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: updateMyProfile
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Chủ tài khoản
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật hồ sơ của chính mình thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/UpdateUserRequest
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
      x-codeSamples:
      - lang: cURL
        label: Cập nhật hồ sơ của chính mình
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/users/me' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\"}'"
  /users/{userId}:
    get:
      tags:
      - users
      summary: Lấy chi tiết một user
      operationId: getUserById
      description: 'Tra cứu một tài khoản theo ID; kiểm tra phạm vi quyền với dữ liệu cá nhân.


        Quyền: operator/admin có users:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getUserById
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết một user thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết một user
        source: "curl -X GET 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111' \\\n\
          \  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
    patch:
      tags:
      - users
      summary: Cập nhật thông tin một user
      operationId: updateUser
      description: 'Chỉ sửa tên/điện thoại. Vai trò và trạng thái dùng chức năng riêng có quyền nhạy cảm.


        Quyền: operator/admin có users:update. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: updateUser
      x-functional-requirements:
      - FR-20
      x-authorization: operator/admin có users:update
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật thông tin một user thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      - TBD-11
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/UpdateUserRequest
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
      x-codeSamples:
      - lang: cURL
        label: Cập nhật thông tin một user
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111' \\\
          \n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\": \"+84901234567\"}'"
    delete:
      tags:
      - users
      summary: Xóa mềm user (vô hiệu hóa tài khoản)
      operationId: deleteUser
      description: 'Đề xuất để hoàn thiện CRUD theo yêu cầu bài làm. Đặt inactive và thu hồi quyền truy cập phiên
        hiện tại; giữ lịch sử chuyến/giao dịch theo TBD-07. Gọi lặp với tài khoản inactive trả 204. Có chuyến hoặc
        nghĩa vụ đang xử lý trả 409 ACCOUNT_IN_USE. Không được vô hiệu hóa quản trị cuối cùng.


        Quyền: admin có users:deactivate. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: deleteUser
      x-functional-requirements:
      - FR-20
      x-authorization: admin có users:deactivate
      x-status: proposed-extension
      responses:
        '204':
          description: Thực hiện thành công, không có response body.
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Xóa mềm user (vô hiệu hóa tài khoản)
        source: "curl -X DELETE 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /users/{userId}/status:
    patch:
      tags:
      - users
      summary: Thay đổi trạng thái tài khoản
      operationId: changeUserStatus
      description: 'Kích hoạt/vô hiệu hóa theo chính sách được duyệt; không bỏ qua điều kiện duyệt tài xế hoặc nghĩa
        vụ đang xử lý. Lưu vết lý do.


        Quyền: admin có users:status. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08, TBD-11.'
      x-function: changeUserStatus
      x-functional-requirements:
      - FR-20
      - FR-24
      x-authorization: admin có users:status
      x-status: proposed-extension
      responses:
        '200':
          description: Thay đổi trạng thái tài khoản thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      - TBD-11
      parameters:
      - name: userId
        in: path
        required: true
        description: Mã userId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/ChangeAccountStatusRequest
            example:
              status: active
              reason: Tạm khóa theo yêu cầu hỗ trợ
      x-codeSamples:
      - lang: cURL
        label: Thay đổi trạng thái tài khoản
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/users/11111111-1111-4111-8111-111111111111/status'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"status\": \"active\", \"reason\": \"Tạm khóa theo yêu cầu hỗ trợ\"\
          }'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: users
  description: Nhóm chức năng users
