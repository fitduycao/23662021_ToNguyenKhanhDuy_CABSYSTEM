openapi: 3.0.3
info:
  title: CAB — audit-logs
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /audit-logs:
    get:
      tags:
      - audit-logs
      summary: Tra cứu nhật ký thao tác quan trọng
      operationId: listAuditLogs
      description: 'Audit được ghi tự động từ thao tác quan trọng; không cung cấp API công khai tạo/sửa/xóa log.
        Không ghi mật khẩu, token, chữ ký hoặc dữ liệu thanh toán nhạy cảm.


        Quyền: admin hoặc người có audit:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: listAuditLogs
      x-functional-requirements:
      - FR-26
      x-authorization: admin hoặc người có audit:read
      x-status: proposed-contract
      responses:
        '200':
          description: Tra cứu nhật ký thao tác quan trọng thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/AuditLogPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  actorReference: system:dispatch
                  action: trip.assigned
                  entityReference: trip:11111111-1111-4111-8111-111111111111
                  result: success
                  occurredAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: entityReference
        in: query
        required: false
        description: Lọc đối tượng
        schema:
          type: string
          description: Lọc đối tượng
          example: trip:11111111-1111-4111-8111-111111111111
      x-codeSamples:
      - lang: cURL
        label: Tra cứu nhật ký thao tác quan trọng
        source: "curl -X GET 'https://api.cab.example.com/api/v1/audit-logs' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /audit-logs/{auditId}:
    get:
      tags:
      - audit-logs
      summary: Lấy chi tiết một bản ghi audit
      operationId: getAuditLogById
      description: 'Đọc bản ghi trong phạm vi được cấp quyền; không tiết lộ bí mật kỹ thuật.


        Quyền: admin hoặc người có audit:read. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-07, TBD-11.'
      x-function: getAuditLogById
      x-functional-requirements:
      - FR-26
      x-authorization: admin hoặc người có audit:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết một bản ghi audit thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/AuditLog
              example:
                id: 11111111-1111-4111-8111-111111111111
                actorReference: system:dispatch
                action: trip.assigned
                entityReference: trip:11111111-1111-4111-8111-111111111111
                result: success
                occurredAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-07
      - TBD-11
      parameters:
      - name: auditId
        in: path
        required: true
        description: Mã auditId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết một bản ghi audit
        source: "curl -X GET 'https://api.cab.example.com/api/v1/audit-logs/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: audit-logs
  description: Nhóm chức năng audit-logs
