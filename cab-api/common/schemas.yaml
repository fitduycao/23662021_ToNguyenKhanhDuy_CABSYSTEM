    pageSize:
      type: integer
      description: Số phần tử tối đa mỗi trang
      example: 20
      minimum: 1
      maximum: 100
    total:
      type: integer
      description: Tổng số bản ghi phù hợp trong phạm vi được phép xem
      example: 1
      minimum: 0
  required:
  - items
  - page
  - pageSize
  - total
