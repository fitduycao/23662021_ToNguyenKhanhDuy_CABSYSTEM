Error:
  type: object
  additionalProperties: false
  properties:
    errorCode:
      type: string
      description: Mã lỗi nghiệp vụ
      example: VALIDATION_ERROR
    message:
      type: string
      description: Thông báo dễ hiểu
      example: Dữ liệu không hợp lệ.
    traceId:
      type: string
      description: Mã truy vết lỗi
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
  required:
  - errorCode
  - message
  - traceId
Coordinates:
  type: object
  additionalProperties: false
  properties:
    latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
      description: Vĩ độ
      example: 10.7769
    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
      description: Kinh độ
      example: 106.7009
  required:
  - latitude
  - longitude
Place:
  type: object
  additionalProperties: false
  properties:
    address:
      type: string
      description: Địa chỉ hiển thị
      example: Điểm đón mẫu, TP.HCM
      minLength: 1
    coordinates:
      $ref: ../common/schemas.yaml#/Coordinates
  required:
  - address
  - coordinates
Registration:
  type: object
  additionalProperties: false
  properties:
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
    password:
      type: string
      description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
      example: ExampleOnly_ChangeMe_123!
      minLength: 1
      writeOnly: true
  required:
  - fullName
  - phone
  - password
  description: Đề xuất dùng điện thoại/mật khẩu; không cho client truyền role hoặc trạng thái đặc quyền.
LoginRequest:
  type: object
  additionalProperties: false
  properties:
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
    password:
      type: string
      description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
      example: ExampleOnly_ChangeMe_123!
      minLength: 1
      writeOnly: true
  required:
  - phone
  - password
User:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã tài khoản
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
    role:
      type: string
      description: Vai trò; ma trận quyền chi tiết TBD-11
      example: customer
      enum:
      - customer
      - driver
      - operator
      - admin
    status:
      type: string
      description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
      example: active
      enum:
      - active
      - inactive
    createdAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - id
  - fullName
  - phone
  - role
  - status
  - createdAt
LoginResult:
  type: object
  additionalProperties: false
  properties:
    accessToken:
      type: string
      description: Bearer token minh họa, không phải token thật
      example: EXAMPLE_ACCESS_TOKEN
    tokenType:
      type: string
      description: Loại token
      example: Bearer
      enum:
      - Bearer
    expiresIn:
      type: integer
      description: Thời gian hiệu lực theo giây; ví dụ, chính sách thực tế TBD-08
      example: 3600
      minimum: 1
    user:
      $ref: ../common/schemas.yaml#/User
  required:
  - accessToken
  - tokenType
  - expiresIn
  - user
CreateUserRequest:
  type: object
  additionalProperties: false
  properties:
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
    password:
      type: string
      description: Mật khẩu đầu vào; chính sách độ mạnh TBD-08. Không xuất trong response/log.
      example: ExampleOnly_ChangeMe_123!
      minLength: 1
      writeOnly: true
  required:
  - fullName
  - phone
  - password
  description: Vận hành tạo tài khoản khách hàng. Tạo tài xế qua Drivers. Không nhận role từ client.
UpdateUserRequest:
  type: object
  additionalProperties: false
  properties:
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
  description: Chỉ cập nhật trường gửi lên; thay số điện thoại theo cơ chế xác minh TBD-08.
  minProperties: 1
ChangeAccountStatusRequest:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
      example: active
      enum:
      - active
      - inactive
    reason:
      type: string
      description: Lý do thay đổi trạng thái
      example: Tạm khóa theo yêu cầu hỗ trợ
      minLength: 1
  required:
  - status
  - reason
Driver:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã tài xế
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    accountId:
      type: string
      description: Mã tài khoản
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
    status:
      type: string
      description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
      example: active
      enum:
      - active
      - inactive
    availability:
      type: string
      description: busy do hệ thống đặt khi phân công; client chỉ được chọn offline/available
      example: available
      enum:
      - offline
      - available
      - busy
  required:
  - id
  - accountId
  - fullName
  - phone
  - status
  - availability
UpdateDriverRequest:
  type: object
  additionalProperties: false
  properties:
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    phone:
      type: string
      description: Số điện thoại; định dạng và xác minh là đề xuất theo TBD-08
      example: '+84901234567'
      minLength: 1
  minProperties: 1
AvailabilityRequest:
  type: object
  additionalProperties: false
  properties:
    availability:
      type: string
      description: Chỉ thay đổi trạng thái chủ động; không được bật available nếu có chuyến đang phục vụ
      example: offline
      enum:
      - offline
      - available
  required:
  - availability
LocationUpdate:
  type: object
  additionalProperties: false
  properties:
    coordinates:
      $ref: ../common/schemas.yaml#/Coordinates
    recordedAt:
      type: string
      description: Thời điểm thiết bị ghi vị trí; kiểm tra độ mới theo TBD-06
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - coordinates
  - recordedAt
DriverLocation:
  type: object
  additionalProperties: false
  properties:
    driverId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    coordinates:
      $ref: ../common/schemas.yaml#/Coordinates
    recordedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
    receivedAt:
      type: string
      description: Thời điểm máy chủ nhận vị trí
      example: '2026-09-13T08:00:00Z'
      format: date-time
    freshness:
      type: string
      description: Độ mới theo chính sách TBD-06
      example: fresh
      enum:
      - fresh
      - stale
      - unknown
  required:
  - driverId
  - coordinates
  - recordedAt
  - receivedAt
  - freshness
ServiceType:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    name:
      type: string
      description: Tên loại xe/dịch vụ minh họa, danh mục TBD-14
      example: Xe 4 chỗ
    active:
      type: boolean
      description: Có đang nhận đặt xe không
      example: true
  required:
  - id
  - name
  - active
Vehicle:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    driverId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    serviceTypeId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    plateNumber:
      type: string
      description: Biển số; quy tắc kiểm tra TBD-08
      example: 51A-123.45
    model:
      type: string
      description: Mẫu xe
      example: Toyota Vios
    status:
      type: string
      description: Trạng thái tài khoản; không dùng để xóa dữ liệu lịch sử
      example: active
      enum:
      - active
      - inactive
  required:
  - id
  - driverId
  - serviceTypeId
  - plateNumber
  - model
  - status
CreateVehicleRequest:
  type: object
  additionalProperties: false
  properties:
    driverId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    serviceTypeId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    plateNumber:
      type: string
      description: Biển số
      example: 51A-123.45
      minLength: 1
    model:
      type: string
      description: Mẫu xe
      example: Toyota Vios
      minLength: 1
  required:
  - driverId
  - serviceTypeId
  - plateNumber
  - model
UpdateVehicleRequest:
  type: object
  additionalProperties: false
  properties:
    serviceTypeId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    plateNumber:
      type: string
      description: Biển số
      example: 51A-123.45
      minLength: 1
    model:
      type: string
      description: Mẫu xe
      example: Toyota Vios
      minLength: 1
  minProperties: 1
CreateTripRequest:
  type: object
  additionalProperties: false
  properties:
    pickup:
      $ref: ../common/schemas.yaml#/Place
    destination:
      $ref: ../common/schemas.yaml#/Place
    serviceTypeId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
  required:
  - pickup
  - destination
  - serviceTypeId
  description: customerId lấy từ danh tính đã xác thực; không cho gửi driverId, status hoặc fare.
Trip:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    customerId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    serviceTypeId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    pickup:
      $ref: ../common/schemas.yaml#/Place
    destination:
      $ref: ../common/schemas.yaml#/Place
    status:
      type: string
      description: Trạng thái chuyến, độc lập với trạng thái thanh toán
      example: searching
      enum:
      - searching
      - assigned
      - arrived
      - picked_up
      - in_progress
      - completed
      - no_driver
      - cancelled
    createdAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
    updatedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - id
  - customerId
  - serviceTypeId
  - pickup
  - destination
  - status
  - createdAt
  - updatedAt
Assignment:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    driverId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    vehicleId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    assignedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - id
  - tripId
  - driverId
  - vehicleId
  - assignedAt
DriverPublic:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    fullName:
      type: string
      description: Họ và tên
      example: Nguyễn Văn An
      minLength: 1
    vehiclePlateNumber:
      type: string
      description: Biển số xe phục vụ
      example: 51A-123.45
    vehicleModel:
      type: string
      description: Mẫu xe phục vụ
      example: Toyota Vios
  required:
  - id
  - fullName
  - vehiclePlateNumber
  - vehicleModel
Tracking:
  type: object
  additionalProperties: false
  properties:
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    status:
      type: string
      description: Trạng thái chuyến, độc lập với trạng thái thanh toán
      example: searching
      enum:
      - searching
      - assigned
      - arrived
      - picked_up
      - in_progress
      - completed
      - no_driver
      - cancelled
    driver:
      allOf:
      - $ref: ../common/schemas.yaml#/DriverPublic
      description: Chỉ có khi đã có phân công được xác nhận
    etaSeconds:
      type: integer
      description: ETA tính theo giây; null khi không có dữ liệu đáng tin cậy
      example: 300
      minimum: 0
      nullable: true
    location:
      allOf:
      - $ref: ../common/schemas.yaml#/DriverLocation
      description: Chỉ có nếu có dữ liệu và người gọi được quyền xem
    updatedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - tripId
  - status
  - etaSeconds
  - updatedAt
TripStatusUpdate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      description: Chuyển đúng thứ tự từ assigned; gửi lặp trạng thái hiện tại không phát sinh tác động lần hai
      example: arrived
      enum:
      - arrived
      - picked_up
      - in_progress
      - completed
    expectedStatus:
      type: string
      description: Trạng thái chuyến, độc lập với trạng thái thanh toán
      example: assigned
      enum:
      - searching
      - assigned
      - arrived
      - picked_up
      - in_progress
      - completed
      - no_driver
      - cancelled
  required:
  - status
  - expectedStatus
  description: expectedStatus dùng kiểm tra xung đột; máy chủ ghi thời điểm chuẩn.
TripStatusEvent:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    status:
      type: string
      description: Trạng thái chuyến, độc lập với trạng thái thanh toán
      example: searching
      enum:
      - searching
      - assigned
      - arrived
      - picked_up
      - in_progress
      - completed
      - no_driver
      - cancelled
    changedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
    changedBy:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
  required:
  - id
  - tripId
  - status
  - changedAt
  - changedBy
CancellationRequest:
  type: object
  additionalProperties: false
  properties:
    reason:
      type: string
      description: Lý do hủy; danh mục và quyền hủy TBD-04
      example: Khách thay đổi kế hoạch
      minLength: 1
  required:
  - reason
Offer:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    driverId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    pickup:
      $ref: ../common/schemas.yaml#/Place
    destination:
      $ref: ../common/schemas.yaml#/Place
    status:
      type: string
      description: Trạng thái đề nghị
      example: pending
      enum:
      - pending
      - accepted
      - declined
      - expired
      - invalidated
    offeredAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
    expiresAt:
      type: string
      description: Thời hạn do chính sách TBD-03 quyết định
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - id
  - tripId
  - driverId
  - pickup
  - destination
  - status
  - offeredAt
  - expiresAt
Fare:
  type: object
  additionalProperties: false
  properties:
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    amount:
      type: integer
      description: Số tiền theo đơn vị nhỏ nhất của currency; VND là đồng. Không nhận số tiền client để tính cước.
      example: 125000
      minimum: 0
      format: int64
    currency:
      type: string
      description: Mã tiền tệ; VND là ví dụ đề xuất
      example: VND
      pattern: ^[A-Z]{3}$
    calculationReference:
      type: string
      description: Phiên bản/quy tắc tính cước đã dùng
      example: fare-policy-example-v1
    calculatedAt:
      type: string
      description: Thời điểm UTC theo RFC 3339
      example: '2026-09-13T08:00:00Z'
      format: date-time
  required:
  - tripId
  - amount
  - currency
  - calculationReference
  - calculatedAt
PaymentRequest:
  type: object
  additionalProperties: false
  properties:
    method:
      type: string
      description: Phương thức thanh toán
      example: cash
      enum:
      - cash
      - electronic
  required:
  - method
  description: Số tiền lấy từ cước trên máy chủ; không nhận dữ liệu thẻ hoặc tài khoản thanh toán.
Payment:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    tripId:
      type: string
      description: Mã định danh
      example: 11111111-1111-4111-8111-111111111111
      format: uuid
    method:
      type: string
      description: Phương thức
      example: electronic
      enum:
      - cash
      - electronic
    amount:
      type: integer
      description: Số tiền theo đơn vị nhỏ nhất của currency; VND là đồng. Không nhận số tiền client để tính cước.
      example: 125000
      minimum: 0
      format: int64
    currency:
      type: string
      description: Mã tiền tệ
      example: VND
      pattern: ^[A-Z]{3}$
    status:
      type: string
      description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
      example: processing
      enum:
      - pending
      - processing
      - succeeded
