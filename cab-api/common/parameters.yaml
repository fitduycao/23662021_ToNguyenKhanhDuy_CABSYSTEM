Page:
  name: page
  in: query
  required: false
  description: Trang bắt đầu từ 1; mặc định đề xuất 1.
  schema:
    type: integer
    description: Trang
    example: 1
    minimum: 1
    default: 1
PageSize:
  name: pageSize
  in: query
  required: false
  description: Số phần tử mỗi trang; mặc định 20, tối đa 100 là đề xuất kỹ thuật.
  schema:
    type: integer
    description: Kích thước trang
    example: 20
    minimum: 1
    maximum: 100
    default: 20
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Khóa chống xử lý lặp do client tạo. Phạm vi chủ thể + operationId; payload khác cùng key trả 409.
    Thời hạn lưu theo cấu hình đã duyệt.
  schema:
    type: string
    description: Khóa yêu cầu
    example: example-request-001
    minLength: 1
WebhookTimestamp:
  name: X-CAB-Timestamp
  in: header
  required: true
  description: Unix seconds dùng trong chữ ký; kiểm tra cửa sổ chống phát lại cấu hình theo TBD-05.
  schema:
    type: string
    description: Thời điểm ký
    example: '1789286400'
    pattern: ^[0-9]+$
