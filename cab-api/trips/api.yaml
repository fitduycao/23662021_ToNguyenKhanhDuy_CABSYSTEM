openapi: 3.0.3
info:
  title: CAB — trips
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /trips:
    post:
      tags:
      - trips
      summary: Tạo mới yêu cầu đặt xe
      operationId: createTrip
      description: 'Tạo chuyến searching, ghi sự kiện booking_received và khởi động điều phối nền. Không chờ tìm
        được tài xế mới trả response. FR-06/08 chạy nội bộ: chọn ứng viên, gửi offer, tìm tiếp khi từ chối/hết hạn;
        hết điều kiện thì no_driver. Khách không phải tạo lại chuyến.


        Quyền: customer. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-02, TBD-03.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: createTrip
      x-functional-requirements:
      - FR-05
      - FR-06
      - FR-08
      - FR-18
      x-authorization: customer
      x-status: proposed-contract
      responses:
        '201':
          description: Tạo mới yêu cầu đặt xe thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Trip
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: searching
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-02
      - TBD-03
      parameters:
      - $ref: ../common/parameters.yaml#/IdempotencyKey
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/CreateTripRequest
            example:
              pickup:
                address: Điểm đón mẫu, TP.HCM
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
              destination:
                address: Điểm đón mẫu, TP.HCM
                coordinates:
                  latitude: 10.7769
                  longitude: 106.7009
              serviceTypeId: 11111111-1111-4111-8111-111111111111
      x-codeSamples:
      - lang: cURL
        label: Tạo mới yêu cầu đặt xe
        source: "curl -X POST 'https://api.cab.example.com/api/v1/trips' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key: example-request-001' \\\n\
          \  -H 'Content-Type: application/json' \\\n  --data '{\"pickup\": {\"address\": \"Điểm đón mẫu, TP.HCM\"\
          , \"coordinates\": {\"latitude\": 10.7769, \"longitude\": 106.7009}}, \"destination\": {\"address\": \"\
          Điểm đón mẫu, TP.HCM\", \"coordinates\": {\"latitude\": 10.7769, \"longitude\": 106.7009}}, \"serviceTypeId\"\
          : \"11111111-1111-4111-8111-111111111111\"}'"
    get:
      tags:
      - trips
      summary: Lấy danh sách/lịch sử chuyến đi
      operationId: listTrips
      description: 'Lọc theo trạng thái trong phạm vi quyền, có phân trang. Số tiền và kết quả thanh toán xem qua
        fare và payments của từng chuyến.


        Quyền: Khách xem chuyến của mình; tài xế xem chuyến được phân công; vận hành có trips:read. Kiểm tra quyền
        và phạm vi tài nguyên tại máy chủ.'
      x-function: listTrips
      x-functional-requirements:
      - FR-11
      - FR-21
      x-authorization: Khách xem chuyến của mình; tài xế xem chuyến được phân công; vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách/lịch sử chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/TripPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  customerId: 11111111-1111-4111-8111-111111111111
                  serviceTypeId: 11111111-1111-4111-8111-111111111111
                  pickup:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  destination:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  status: searching
                  createdAt: '2026-09-13T08:00:00Z'
                  updatedAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: status
        in: query
        required: false
        description: Trạng thái chuyến, độc lập với trạng thái thanh toán
        schema:
          type: string
          description: Trạng thái chuyến, độc lập với trạng thái thanh toán
          example: searching
          enum:
          - searching
          - assigned
          - arrived
          - picked_up
          - in_progress
          - completed
          - no_driver
          - cancelled
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách/lịch sử chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips' \\\n  -H 'Accept: application/json' \\\n\
          \  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /trips/{tripId}:
    get:
      tags:
      - trips
      summary: Lấy chi tiết một chuyến đi
      operationId: getTripById
      description: 'Trả trạng thái hiện tại; no_driver/cancelled/completed là kết quả riêng, không bị thay đổi bởi
        lỗi thanh toán.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Kiểm tra quyền và phạm vi tài
        nguyên tại máy chủ.'
      x-function: getTripById
      x-functional-requirements:
      - FR-09
      - FR-11
      - FR-21
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết một chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Trip
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: searching
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết một chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111' \\\n\
          \  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /trips/{tripId}/tracking:
    get:
      tags:
      - trips
      summary: Theo dõi tài xế, ETA và trạng thái chuyến
      operationId: trackTrip
      description: 'Chỉ trả driver sau phân công hợp lệ. ETA không khả dụng trả null; vị trí có freshness. Dừng
        lộ vị trí trực tiếp sau khi chuyến kết thúc theo quyền lưu trữ.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Đề xuất thiết kế API; cần xác
        nhận chính sách tại TBD-06, TBD-07.'
      x-function: trackTrip
      x-functional-requirements:
      - FR-09
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Theo dõi tài xế, ETA và trạng thái chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Tracking
              example:
                tripId: 11111111-1111-4111-8111-111111111111
                status: assigned
                driver:
                  id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  vehiclePlateNumber: 51A-123.45
                  vehicleModel: Toyota Vios
                etaSeconds: 300
                location:
                  driverId: 11111111-1111-4111-8111-111111111111
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                  recordedAt: '2026-09-13T08:00:00Z'
                  receivedAt: '2026-09-13T08:00:00Z'
                  freshness: fresh
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-06
      - TBD-07
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Theo dõi tài xế, ETA và trạng thái chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/tracking'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /trips/{tripId}/status:
    patch:
      tags:
      - trips
      summary: Cập nhật quá trình thực hiện chuyến
      operationId: updateTripStatus
      description: 'Kiểm tra expectedStatus và thứ tự assigned → arrived → picked_up → in_progress → completed.
        Sai thứ tự trả 409 INVALID_TRIP_TRANSITION. Khi completed, kích hoạt tính cước và thông báo qua sự kiện
        bền vững. Lặp cùng cập nhật không tính cước hoặc gửi sự kiện lần hai.


        Quyền: Tài xế đang được phân công. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: updateTripStatus
      x-functional-requirements:
      - FR-10
      - FR-13
      - FR-18
      - FR-19
      x-authorization: Tài xế đang được phân công
      x-status: proposed-contract
      responses:
        '200':
          description: Cập nhật quá trình thực hiện chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Trip
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: arrived
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/TripStatusUpdate
            example:
              status: arrived
              expectedStatus: assigned
      x-codeSamples:
      - lang: cURL
        label: Cập nhật quá trình thực hiện chuyến
        source: "curl -X PATCH 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/status'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type:\
          \ application/json' \\\n  --data '{\"status\": \"arrived\", \"expectedStatus\": \"assigned\"}'"
  /trips/{tripId}/status-history:
    get:
      tags:
      - trips
      summary: Lấy lịch sử trạng thái chuyến
      operationId: listTripStatusHistory
      description: 'Lấy các trạng thái và thời điểm ghi nhận theo thứ tự thời gian.


        Quyền: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read. Kiểm tra quyền và phạm vi tài
        nguyên tại máy chủ.'
      x-function: listTripStatusHistory
      x-functional-requirements:
      - FR-10
      - FR-21
      x-authorization: Khách của chuyến, tài xế được phân công hoặc vận hành có trips:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy lịch sử trạng thái chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/TripStatusEventPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  status: searching
                  changedAt: '2026-09-13T08:00:00Z'
                  changedBy: 11111111-1111-4111-8111-111111111111
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: tripId
        in: path
        required: true
        description: Mã tripId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      x-codeSamples:
      - lang: cURL
        label: Lấy lịch sử trạng thái chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/trips/11111111-1111-4111-8111-111111111111/status-history'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /trips/{tripId}/cancellations:
    post:
      tags:
      - trips
      summary: Hủy chuyến theo chính sách
      operationId: cancelTrip
      description: 'Chỉ hủy tại trạng thái được duyệt; giải phóng phân công và vô hiệu offer còn mở một cách nhất
        quán. Chưa cấu hình chính sách trả 409 POLICY_NOT_CONFIGURED, không tự quyết định phí hoặc quyền hủy.


        Quyền: Actor được chính sách TBD-04 cho phép. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-04.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: cancelTrip
      x-functional-requirements:
      - FR-27
      - FR-19
      x-authorization: Actor được chính sách TBD-04 cho phép
      x-status: proposed-contract
      responses:
        '200':
          description: Hủy chuyến theo chính sách thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Trip
              example:
                id: 11111111-1111-4111-8111-111111111111
                customerId: 11111111-1111-4111-8111-111111111111
                serviceTypeId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: cancelled
                createdAt: '2026-09-13T08:00:00Z'
                updatedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
