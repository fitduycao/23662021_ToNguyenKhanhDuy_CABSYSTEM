description: Luồng nội bộ bổ trợ REST; đây là tài liệu nghiệp vụ YAML, không phải OpenAPI hay AsyncAPI. Không triển
  khai như endpoint công khai.
workflows:
- name: dispatchTrip
  functionalRequirements:
  - FR-06
  - FR-07
  - FR-08
  trigger: trip.created
  steps:
  - Chọn tài xế sẵn sàng, vị trí đủ mới và phương tiện phù hợp theo TBD-02/06.
  - Ưu tiên ứng viên và tạo offer + thông báo bền vững.
  - Bộ hẹn giờ hết hạn theo TBD-03; từ chối/hết hạn tiếp tục tìm trên cùng tripId.
  - Chấp nhận kiểm tra nguyên tử cả trip và driver; vô hiệu offer còn lại.
  - 'Hết điều kiện tìm: no_driver và thông báo khách.'
  tbd:
  - TBD-02
  - TBD-03
  - TBD-06
- name: calculateCompletedTripFare
  functionalRequirements:
  - FR-13
  trigger: trip.completed
  steps:
  - Tính theo chính sách cước đã duyệt và dữ liệu chuyến trên máy chủ.
  - Lưu đúng một kết quả hiệu lực; sự kiện lặp không tính/ghi trùng.
  - 'Thiếu dữ liệu hoặc chính sách: đánh dấu cần hỗ trợ, không ghi cước 0.'
  tbd:
  - TBD-01
- name: deliverNotifications
  functionalRequirements:
  - FR-18
  - FR-19
  trigger: booking_received, driver_assigned, driver_arrived, trip_completed, payment_succeeded, payment_failed,
    offer_created, trip_changed, no_driver_found
  steps:
  - Ghi sự kiện bền vững cùng thay đổi nghiệp vụ hoặc dùng cơ chế đảm bảo tương đương.
  - Worker gửi đúng người nhận qua kênh được chọn; theo dõi pending/sent/failed.
  - Gửi lại theo chính sách; ngăn thông báo lặp hoặc lỗi thời gây hiểu nhầm.
  - Hỏng nhà cung cấp không hoàn tác hoặc dừng toàn bộ đặt xe.
  tbd:
  - TBD-09
  - TBD-12
- name: reconcileUnknownPayment
  functionalRequirements:
  - FR-16
  - FR-17
  trigger: Kết quả thanh toán chưa xác định hoặc webhook bị chậm
  steps:
  - Giữ pending/processing và chặn tạo lần thu mới trên cùng chuyến.
  - Tra cứu giao dịch cũ qua đối tác theo tham chiếu, không tạo lệnh thu mới.
  - Đối chiếu amount/currency/reference rồi cập nhật kết quả chắc chắn một lần.
  - Chỉ cho thử lại sau failed chắc chắn và theo chính sách.
  tbd:
  - TBD-05
- name: recordAudit
  functionalRequirements:
  - FR-26
  trigger: Thao tác quan trọng thuộc danh mục đã duyệt
  steps:
  - Ghi chủ thể, hành động, đối tượng, thời điểm và kết quả.
  - Không ghi bí mật hoặc dữ liệu thanh toán nhạy cảm.
  - Quyền đọc và thời gian lưu theo chính sách.
  tbd:
  - TBD-07
  - TBD-11
