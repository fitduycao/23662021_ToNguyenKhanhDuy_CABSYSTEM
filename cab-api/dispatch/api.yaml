openapi: 3.0.3
info:
  title: CAB — dispatch
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /dispatch-offers:
    get:
      tags:
      - dispatch
      summary: Lấy danh sách đề nghị nhận chuyến
      operationId: listMyDispatchOffers
      description: 'Chỉ trả đề nghị của chính tài xế; hỗ trợ đọc lại khi thông báo ngoài gián đoạn. Offer được hệ
        thống tạo nội bộ, không do khách/tài xế tự tạo.


        Quyền: driver. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listMyDispatchOffers
      x-functional-requirements:
      - FR-07
      - FR-19
      x-authorization: driver
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách đề nghị nhận chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/OfferPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  driverId: 11111111-1111-4111-8111-111111111111
                  pickup:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  destination:
                    address: Điểm đón mẫu, TP.HCM
                    coordinates:
                      latitude: 10.7769
                      longitude: 106.7009
                  status: pending
                  offeredAt: '2026-09-13T08:00:00Z'
                  expiresAt: '2026-09-13T08:01:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: status
        in: query
        required: false
        description: Lọc trạng thái đề nghị
        schema:
          type: string
          description: Lọc trạng thái đề nghị
          example: pending
          enum:
          - pending
          - accepted
          - declined
          - expired
          - invalidated
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách đề nghị nhận chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/dispatch-offers' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /dispatch-offers/{offerId}:
    get:
      tags:
      - dispatch
      summary: Lấy chi tiết đề nghị nhận chuyến
      operationId: getDispatchOffer
      description: 'Kiểm tra offer thuộc tài xế đang đăng nhập.


        Quyền: Tài xế nhận đề nghị. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getDispatchOffer
      x-functional-requirements:
      - FR-07
      x-authorization: Tài xế nhận đề nghị
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết đề nghị nhận chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Offer
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: pending
                offeredAt: '2026-09-13T08:00:00Z'
                expiresAt: '2026-09-13T08:01:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: offerId
        in: path
        required: true
        description: Mã offerId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết đề nghị nhận chuyến
        source: "curl -X GET 'https://api.cab.example.com/api/v1/dispatch-offers/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /dispatch-offers/{offerId}/accept:
    post:
      tags:
      - dispatch
      summary: Chấp nhận chuyến
      operationId: acceptDispatchOffer
      description: 'Kiểm tra thời hạn, trạng thái chuyến và tài xế còn sẵn sàng trong cùng thao tác nguyên tử. Tạo
        tối đa một phân công hiệu lực, đặt busy, vô hiệu offer khác, phát driver_assigned. Offer hết hạn trả 409
        OFFER_EXPIRED; đã có tài xế khác trả 409 TRIP_ALREADY_ASSIGNED.


        Quyền: Tài xế nhận đề nghị. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-02, TBD-03.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: acceptDispatchOffer
      x-functional-requirements:
      - FR-07
      - FR-09
      - FR-18
      x-authorization: Tài xế nhận đề nghị
      x-status: proposed-contract
      responses:
        '200':
          description: Chấp nhận chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Assignment
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                vehicleId: 11111111-1111-4111-8111-111111111111
                assignedAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-02
      - TBD-03
      parameters:
      - name: offerId
        in: path
        required: true
        description: Mã offerId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ../common/parameters.yaml#/IdempotencyKey
      x-codeSamples:
      - lang: cURL
        label: Chấp nhận chuyến
        source: "curl -X POST 'https://api.cab.example.com/api/v1/dispatch-offers/11111111-1111-4111-8111-111111111111/accept'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001'"
  /dispatch-offers/{offerId}/decline:
    post:
      tags:
      - dispatch
      summary: Từ chối chuyến
      operationId: declineDispatchOffer
      description: 'Đánh dấu declined, kích hoạt tìm ứng viên khác trên cùng tripId. Bộ hẹn giờ nội bộ xử lý hết
        hạn tương tự; không cần client gọi để tiếp tục tìm.


        Quyền: Tài xế nhận đề nghị. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-03.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: declineDispatchOffer
      x-functional-requirements:
      - FR-07
      - FR-08
      x-authorization: Tài xế nhận đề nghị
      x-status: proposed-contract
      responses:
        '200':
          description: Từ chối chuyến thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Offer
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                driverId: 11111111-1111-4111-8111-111111111111
                pickup:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                destination:
                  address: Điểm đón mẫu, TP.HCM
                  coordinates:
                    latitude: 10.7769
                    longitude: 106.7009
                status: declined
                offeredAt: '2026-09-13T08:00:00Z'
                expiresAt: '2026-09-13T08:01:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-03
      parameters:
      - name: offerId
        in: path
        required: true
        description: Mã offerId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ../common/parameters.yaml#/IdempotencyKey
      x-codeSamples:
      - lang: cURL
        label: Từ chối chuyến
        source: "curl -X POST 'https://api.cab.example.com/api/v1/dispatch-offers/11111111-1111-4111-8111-111111111111/decline'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: dispatch
  description: Nhóm chức năng dispatch
