openapi: 3.0.3
info:
  title: CAB — operations
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /operations/transactions:
    get:
      tags:
      - operations
      summary: Tra cứu lịch sử giao dịch vận hành
      operationId: listTransactions
      description: 'Tra cứu giao dịch tập trung theo chuyến/trạng thái; chỉ trả dữ liệu trong phạm vi quyền.


        Quyền: operator/admin có payments:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.


        checkoutUrl chỉ trả cho khách sở hữu giao dịch; trả null cho tài xế/vận hành. Không ghi URL chứa token vào
        log.'
      x-function: listTransactions
      x-functional-requirements:
      - FR-23
      x-authorization: operator/admin có payments:read
      x-status: proposed-contract
      responses:
        '200':
          description: Tra cứu lịch sử giao dịch vận hành thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/PaymentPage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  method: electronic
                  amount: 125000
                  currency: VND
                  status: processing
                  providerReference: provider_tx_example
                  checkoutUrl: https://payments.example.com/checkout/example
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: tripId
        in: query
        required: false
        description: Mã định danh
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - name: status
        in: query
        required: false
        description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
        schema:
          type: string
          description: pending/processing là chưa có kết quả chắc chắn; không được thu lại
          example: processing
          enum:
          - pending
          - processing
          - succeeded
          - failed
      x-codeSamples:
      - lang: cURL
        label: Tra cứu lịch sử giao dịch vận hành
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/transactions' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /operations/support-cases:
    post:
      tags:
      - operations
      summary: Ghi nhận sự cố chuyến đi
      operationId: createSupportCase
      description: 'Đề xuất tài nguyên hỗ trợ để ghi nhận sự cố. Không tự ý sửa phân công, cước hoặc kết quả thanh
        toán.


        Quyền: operator/admin có support:create. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.'
      x-function: createSupportCase
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:create
      x-status: proposed-contract
      responses:
        '201':
          description: Ghi nhận sự cố chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/SupportCase
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                description: Khách báo chưa thấy cập nhật trạng thái.
                status: open
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-11
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/SupportCaseRequest
            example:
              tripId: 11111111-1111-4111-8111-111111111111
              description: Khách báo chưa thấy cập nhật trạng thái.
      x-codeSamples:
      - lang: cURL
        label: Ghi nhận sự cố chuyến đi
        source: "curl -X POST 'https://api.cab.example.com/api/v1/operations/support-cases' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Content-Type: application/json' \\\n\
          \  --data '{\"tripId\": \"11111111-1111-4111-8111-111111111111\", \"description\": \"Khách báo chưa thấy\
          \ cập nhật trạng thái.\"}'"
    get:
      tags:
      - operations
      summary: Lấy danh sách sự cố chuyến đi
      operationId: listSupportCases
      description: 'Danh sách sự cố đã ghi nhận, có phân trang.


        Quyền: operator/admin có support:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: listSupportCases
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy danh sách sự cố chuyến đi thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/SupportCasePage
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  tripId: 11111111-1111-4111-8111-111111111111
                  description: Khách báo chưa thấy cập nhật trạng thái.
                  status: open
                  createdAt: '2026-09-13T08:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - $ref: ../common/parameters.yaml#/Page
      - $ref: ../common/parameters.yaml#/PageSize
      - name: status
        in: query
        required: false
        description: Trạng thái xử lý
        schema:
          type: string
          description: Trạng thái xử lý
          example: open
          enum:
          - open
          - resolved
      x-codeSamples:
      - lang: cURL
        label: Lấy danh sách sự cố chuyến đi
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/support-cases' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /operations/support-cases/{caseId}:
    get:
      tags:
      - operations
      summary: Lấy chi tiết sự cố
      operationId: getSupportCaseById
      description: 'Tra cứu sự cố cùng tripId để mở chi tiết chuyến/giao dịch.


        Quyền: operator/admin có support:read. Kiểm tra quyền và phạm vi tài nguyên tại máy chủ.'
      x-function: getSupportCaseById
      x-functional-requirements:
      - FR-22
      x-authorization: operator/admin có support:read
      x-status: proposed-contract
      responses:
        '200':
          description: Lấy chi tiết sự cố thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/SupportCase
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                description: Khách báo chưa thấy cập nhật trạng thái.
                status: open
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      parameters:
      - name: caseId
        in: path
        required: true
        description: Mã caseId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      x-codeSamples:
      - lang: cURL
        label: Lấy chi tiết sự cố
        source: "curl -X GET 'https://api.cab.example.com/api/v1/operations/support-cases/11111111-1111-4111-8111-111111111111'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN'"
  /operations/support-cases/{caseId}/resolution:
    post:
      tags:
      - operations
      summary: Ghi nhận kết quả hỗ trợ
      operationId: resolveSupportCase
      description: 'Đóng hồ sơ hỗ trợ và lưu ghi chú/audit. Đây không phải quyền sửa tùy ý trạng thái chuyến; thao
        tác khắc phục có tác động nghiệp vụ khác phải được chốt ở TBD-11.


        Quyền: operator/admin có support:resolve. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-11.


        Idempotency-Key bắt buộc: cùng chủ thể + operationId + key và cùng path/query/body trả lại cùng kết quả/tài
        nguyên, không thực hiện lần hai; đổi path/query/body với cùng key trả 409 IDEMPOTENCY_CONFLICT. Thời hạn
        lưu key cần được cấu hình trước triển khai.'
      x-function: resolveSupportCase
      x-functional-requirements:
      - FR-22
      - FR-26
      x-authorization: operator/admin có support:resolve
      x-status: proposed-contract
      responses:
        '200':
          description: Ghi nhận kết quả hỗ trợ thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/SupportCase
              example:
                id: 11111111-1111-4111-8111-111111111111
                tripId: 11111111-1111-4111-8111-111111111111
                description: Khách báo chưa thấy cập nhật trạng thái.
                status: resolved
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-11
      parameters:
      - name: caseId
        in: path
        required: true
        description: Mã caseId; luôn kiểm tra quyền với đối tượng tương ứng
        schema:
          type: string
          description: Mã định danh
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      - $ref: ../common/parameters.yaml#/IdempotencyKey
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/ResolveCaseRequest
            example:
              resolutionNote: Đã kiểm tra và hướng dẫn khách đồng bộ lại.
      x-codeSamples:
      - lang: cURL
        label: Ghi nhận kết quả hỗ trợ
        source: "curl -X POST 'https://api.cab.example.com/api/v1/operations/support-cases/11111111-1111-4111-8111-111111111111/resolution'\
          \ \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer EXAMPLE_ACCESS_TOKEN' \\\n  -H 'Idempotency-Key:\
          \ example-request-001' \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"resolutionNote\": \"\
          Đã kiểm tra và hướng dẫn khách đồng bộ lại.\"}'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: operations
  description: Nhóm chức năng operations
