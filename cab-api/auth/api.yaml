openapi: 3.0.3
info:
  title: CAB — auth
  version: 0.1.0
  description: Đặc tả đề xuất từ FR-01–FR-27 trong srs.md. Chưa phải backend đã triển khai. Trường dữ liệu, quyền
    và các chính sách TBD cần duyệt. Domain example.com chỉ minh họa.
servers:
- url: https://api.cab.example.com/api/v1
  description: Địa chỉ minh họa, chưa có dịch vụ hoạt động
security:
- BearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - auth
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      description: 'Tạo mới tài khoản khách hàng. Số điện thoại trùng trả 409 ACCOUNT_EXISTS. Không được truyền
        vai trò quản trị.


        Quyền: Công khai; luôn tạo vai trò customer. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: registerCustomer
      x-functional-requirements:
      - FR-01
      x-authorization: Công khai; luôn tạo vai trò customer
      x-status: proposed-contract
      responses:
        '201':
          description: Đăng ký tài khoản khách hàng thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/User
              example:
                id: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                role: customer
                status: active
                createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/Registration
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Đăng ký tài khoản khách hàng
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/register' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\"\
          : \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"}'"
  /auth/drivers/register:
    post:
      tags:
      - auth
      summary: Tài xế tự đăng ký
      operationId: registerDriver
      description: 'Tạo tài khoản và hồ sơ tài xế trong cùng giao dịch. Trạng thái đủ điều kiện nhận xe phải theo
        chính sách duyệt, không tự bật available.


        Quyền: Công khai; luôn tạo vai trò driver. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: registerDriver
      x-functional-requirements:
      - FR-02
      x-authorization: Công khai; luôn tạo vai trò driver
      x-status: proposed-contract
      responses:
        '201':
          description: Tài xế tự đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/Driver
              example:
                id: 11111111-1111-4111-8111-111111111111
                accountId: 11111111-1111-4111-8111-111111111111
                fullName: Nguyễn Văn An
                phone: '+84901234567'
                status: active
                availability: offline
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/Registration
            example:
              fullName: Nguyễn Văn An
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Tài xế tự đăng ký
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/drivers/register' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"fullName\": \"Nguyễn Văn An\", \"phone\"\
          : \"+84901234567\", \"password\": \"ExampleOnly_ChangeMe_123!\"}'"
  /auth/login:
    post:
      tags:
      - auth
      summary: Đăng nhập
      operationId: login
      description: 'Xác thực số điện thoại/mật khẩu. Thông tin sai hoặc tài khoản không còn hoạt động trả 401 với
        thông báo chung; không tiết lộ tài khoản có tồn tại hay không.


        Quyền: Khách hàng, tài xế, vận hành và quản trị. Đề xuất thiết kế API; cần xác nhận chính sách tại TBD-08.'
      x-function: login
      x-functional-requirements:
      - FR-01
      - FR-02
      x-authorization: Khách hàng, tài xế, vận hành và quản trị
      x-status: proposed-contract
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: ../common/schemas.yaml#/LoginResult
              example:
                accessToken: EXAMPLE_ACCESS_TOKEN
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  fullName: Nguyễn Văn An
                  phone: '+84901234567'
                  role: customer
                  status: active
                  createdAt: '2026-09-13T08:00:00Z'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '409':
          $ref: ../common/responses.yaml#/Conflict
        '422':
          $ref: ../common/responses.yaml#/Unprocessable
        '429':
          $ref: ../common/responses.yaml#/TooManyRequests
        '500':
          $ref: ../common/responses.yaml#/InternalError
        '503':
          $ref: ../common/responses.yaml#/Unavailable
      x-tbd:
      - TBD-08
      security: []
      requestBody:
        required: true
        description: 'Dữ liệu đầu vào; Content-Type: application/json. Trường không được khai báo bị từ chối.'
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/LoginRequest
            example:
              phone: '+84901234567'
              password: ExampleOnly_ChangeMe_123!
      x-codeSamples:
      - lang: cURL
        label: Đăng nhập
        source: "curl -X POST 'https://api.cab.example.com/api/v1/auth/login' \\\n  -H 'Accept: application/json'\
          \ \\\n  -H 'Content-Type: application/json' \\\n  --data '{\"phone\": \"+84901234567\", \"password\":\
          \ \"ExampleOnly_ChangeMe_123!\"}'"
components:
  securitySchemes:
    BearerAuth:
      $ref: ../common/security.yaml#/BearerAuth
    WebhookSignature:
      $ref: ../common/security.yaml#/WebhookSignature
tags:
- name: auth
  description: Nhóm chức năng auth
